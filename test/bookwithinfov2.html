<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: start;
      align-items: start;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    .mainbookinfo {
      display: flex;
      width: 100%;
      height: 100%;
      flex-direction: column;
      border-radius: 15px;
      background: #FFF;
      box-shadow: 0px 3px 5px 0px rgba(0, 0, 0, 0.10);
    }

    .mainbookinfo_part1 {
      display: flex;
      width: 100%;
      height: 258px;
      flex-direction: column;
    }

    .mainbookinfo_part11 {
      position: absolute;
      width: 85px;
      height: 43px;
      flex-shrink: 0;
      background-color: #467D1E;
      border-bottom: 2px solid #87DB4A;
      border-right: 2px solid #87DB4A;
      border-radius: 15px 0 15px 0;
      filter: drop-shadow(0px 4px 4px rgba(0, 0, 0, 0.25));
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .mainbookinfo_part11 span {
      color: #FFF;
      font-family: Noto Sans CJK TC;
      font-size: 14px;
      font-style: normal;
      font-weight: 500;
      letter-spacing: 2.24px;
    }

    .mainbookinfo_part12 img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .mainbookinfo_part2 {
      display: flex;
      flex-direction: column;
      padding-left: 10px;
      padding-right: 10px;
      padding-top: 10px;
      padding-bottom: 30px;
      row-gap: 10px;
    }

    .mainbookinfo_part22 {
      display: flex;
      width: 100%;
      height: 100%;
      flex-direction: row;
      column-gap: 4px;
      flex-wrap: wrap;
      row-gap: 5px;
    }

    .mainbookinfo_part21 span {
      color: #000;
      font-family: Noto Sans CJK TC;
      font-size: 20px;
      font-style: normal;
      font-weight: 700;
      line-height: 30px;
      letter-spacing: 3.2px;
    }

    .frequest_search1 {
      display: flex;
      padding: 3px 10px;
      justify-content: center;
      align-items: center;
      gap: 10px;
      border-radius: 15px;
      border: 1px solid var(--color-01, #467D1E);
      background: #FFF;
    }

    .frequest_search1 span {
      color: #467D1E;
      text-align: center;
      font-family: Noto Sans CJK TC;
      font-size: 16px;
      font-style: normal;
      font-weight: 700;
      letter-spacing: 2.56px;
    }

    .mainbookinfo_part23 {
      display: flex;
      flex-direction: row;
      align-items: center;
    }

    .mainbookinfo_part23_1 img {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
    }

    .mainbookinfo_part23_2 span {
      color: #000;
      font-family: Noto Sans CJK TC;
      font-size: 14px;
      font-style: normal;
      font-weight: 500;
      letter-spacing: 2.24px;
    }

    /* Media Queries */
    @media (max-width: 320px) {
      /* Adjust styles for smaller screens */
      .mainbookinfo {
        width: 100%;
        height: auto;
      }

      .mainbookinfo_part1 {
        height: auto;
      }

      .mainbookinfo_part11 {
        position: static;
        margin-bottom: 10px;
      }

      .mainbookinfo_part2 {
        padding-left: 5px;
        padding-right: 5px;
      }
    }
  </style>
</head>

<body>
  <div class="mainbookinfo">
    <div class="mainbookinfo_part1">
      <div class="mainbookinfo_part11"><span>網頁遊戲</span></div>
      <div class="mainbookinfo_part12"><img src="images/bookRectangle_248.svg"></div>
    </div>
    <div class="mainbookinfo_part2">
      <div class="mainbookinfo_part21">
        <span>小勇士出大任務：魔王迷宮士出大任務：魔王迷宮</span>
      </div>
      <div class="mainbookinfo_part22">
        <div class="frequest_search1">
          <span>台灣水土保持</span>
        </div>
        <div class="frequest_search1">
          <span>台灣</span>
        </div>
        <div class="frequest_search1">
          <span>台灣水土保持</span>
        </div>
      </div>
      <div class="mainbookinfo_part23">
        <div class="mainbookinfo_part23_1">
          <img src="images/icon_user.svg">
        </div>
        <div class="mainbookinfo_part23_2">
          <span>國小高年級,國中</span>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
