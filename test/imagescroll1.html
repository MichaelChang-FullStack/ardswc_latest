<script>
   jQuery(document).ready(function($) {
        var $slickMarquee = $('.slick.marquee').slick({
            speed: 5000,
            autoplay: true,
            autoplaySpeed: 0,
            centerMode: true,
            cssEase: 'linear',
            slidesToShow: 1,
            slidesToScroll: 1,
            variableWidth: true,
            infinite: true,
            initialSlide: 1,
            arrows: false,
            dots: true,
            appendDots: $('.slick-dots'),
            customPaging: function(slider, i) {
                return '<button>' + (i + 1) + '</button>';
            },
            pauseOnHover: false
        });

        $('.slick-dots button').on('click', function() {
            var index = $(this).index();
            $slickMarquee.slick('slickGoTo', index); // Navigate to the clicked page
        });
    });
</script>
