        <div class="columns" style="margin-top:0;padding-top:20px;">

                <figure>

                    </div>
                    <div style="width:100%;text-align:center;">
                        <a href="Files/class/Facility/20190827232956.JPG" onfocus="$('#img1').fadeTo('fast', 0.5)" onblur="$('#img1').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery1" data-transition-effect="circular" data-loop="true">

                        </a>
                    </div>
                    <div style="width:100%;display:flex;justify-content:center;padding-top:10px;">
                        提供園區行政管理、導覽諮詢、遊客飲水休息、急救通報處理及苗栽核配管理等服務。
                    </div>
                </figure>
            </div>
            <div class="column">
                <figure>
                    <div style="width:100%;text-align:center;color:green;font-size:1.2em;">
                        園區生態池
                    </div>
                    <div style="width:100%;text-align:center;">
                        <a href="Files/class/Facility/20190827234303.JPG" onfocus="$('#img2').fadeTo('fast', 0.5)" onblur="$('#img2').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery2" data-transition-effect="circular" data-loop="true">
                            <img src="Files/class/Facility/20190827234303.JPG" alt="園區生態池20190827234303.JPG" style="max-width:180px;max-height:180px;" id="img2">

                        <a href="Files/class/Facility/20190827234658.JPG" onfocus="$('#img3').fadeTo('fast', 0.5)" onblur="$('#img3').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery3" data-transition-effect="circular" data-loop="true">
                            <img src="Files/class/Facility/20190827234658.JPG" alt="園區生態池20190827234658.JPG" style="max-width:180px;max-height:180px;" id="img3">
                        </a>
                    </div>
                    <div style="width:100%;display:flex;justify-content:center;padding-top:10px;">
                        提供教學觀賞之池塘。
                    </div>
                </figure>
            </div>
    <div class="column"><figure><div style="width:100%;text-align:center;color:green;font-size:1.2em;">苗圃區</div>
    <div style="width:100%;text-align:center;">
    <a href="Files/class/Facility/20190821121611.JPG" onfocus="$('#img4').fadeTo('fast', 0.5)" onblur="$('#img4').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery4" data-transition-effect="circular" data-loop="true"><img src="Files/class/Facility/20190821121611.JPG" alt="苗圃區20190821121611.JPG" style="max-width:180px;max-height:180px;" id="img4"></a>
    <a href="Files/class/Facility/20190821121621.JPG" onfocus="$('#img5').fadeTo('fast', 0.5)" onblur="$('#img5').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery5" data-transition-effect="circular" data-loop="true"><img src="Files/class/Facility/20190821121621.JPG" alt="苗圃區20190821121621.JPG" style="max-width:180px;max-height:180px;" id="img5"></a>
    </div><div style="width:100%;display:flex;justify-content:center;padding-top:10px;">栽培環境綠化美化苗木，提供縣內各學校、機關、團體、社區申請，相關申請辦法，可參詢仁山植物園網站。</div></figure></div>
    <div class="column"><figure><div style="width:100%;text-align:center;color:green;font-size:1.2em;">百草園</div>
    <div style="width:100%;text-align:center;">
    <a href="Files/class/Facility/20190821121842.jpg" onfocus="$('#img6').fadeTo('fast', 0.5)" onblur="$('#img6').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery6" data-transition-effect="circular" data-loop="true"><img src="Files/class/Facility/20190821121842.jpg" alt="百草園20190821121842.jpg" style="max-width:180px;max-height:180px;" id="img6"></a>
    <a href="Files/class/Facility/20190821121849.jpg" onfocus="$('#img7').fadeTo('fast', 0.5)" onblur="$('#img7').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery7" data-transition-effect="circular" data-loop="true"><img src="Files/class/Facility/20190821121849.jpg" alt="百草園20190821121849.jpg" style="max-width:180px;max-height:180px;" id="img7"></a>
    </div><div style="width:100%;display:flex;justify-content:center;padding-top:10px;">本區展示民間常見中草藥植物如魚腥草、火炭母草等，僅供展示參考，有關其藥用特性及用法，仍應洽合格中醫師所開立處方為準。</div></figure></div>
    <div class="column"><figure><div style="width:100%;text-align:center;color:green;font-size:1.2em;">健康體能園地</div>
    <div style="width:100%;text-align:center;">
    <a href="Files/class/Facility/20190827233734.JPG" onfocus="$('#img8').fadeTo('fast', 0.5)" onblur="$('#img8').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery8" data-transition-effect="circular" data-loop="true"><img src="Files/class/Facility/20190827233734.JPG" alt="健康體能園地20190827233734.JPG" style="max-width:180px;max-height:180px;" id="img8"></a>
    <a href="Files/class/Facility/20190827233756.JPG" onfocus="$('#img9').fadeTo('fast', 0.5)" onblur="$('#img9').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery9" data-transition-effect="circular" data-loop="true"><img src="Files/class/Facility/20190827233756.JPG" alt="健康體能園地20190827233756.JPG" style="max-width:180px;max-height:180px;" id="img9"></a>
    </div><div style="width:100%;display:flex;justify-content:center;padding-top:10px;">設置有12種體能活動器材，獨特的科學化戶外休閒設施，為強化個人健康及完整的自我體能訓練而設計。</div></figure></div>
    <div class="column"><figure><div style="width:100%;text-align:center;color:green;font-size:1.2em;">觀景平台　</div>
    <div style="width:100%;text-align:center;">
    <a href="Files/class/Facility/20190821115815.JPG" onfocus="$('#img10').fadeTo('fast', 0.5)" onblur="$('#img10').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery10" data-transition-effect="circular" data-loop="true"><img src="Files/class/Facility/20190821115815.JPG" alt="觀景平台　20190821115815.JPG" style="max-width:180px;max-height:180px;" id="img10"></a>
    <a href="Files/class/Facility/20190821115835.JPG" onfocus="$('#img11').fadeTo('fast', 0.5)" onblur="$('#img11').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery11" data-transition-effect="circular" data-loop="true"><img src="Files/class/Facility/20190821115835.JPG" alt="觀景平台　20190821115835.JPG" style="max-width:180px;max-height:180px;" id="img11"></a>
    </div><div style="width:100%;display:flex;justify-content:center;padding-top:10px;">為植物園區視野最佳處，可瞭望丸山遺址、冬山河、蘭陽溪口、龜山島及整個蘭陽平原。</div></figure></div>
    <div class="column"><figure><div style="width:100%;text-align:center;color:green;font-size:1.2em;">艾園(唐式庭園)　</div>
    <div style="width:100%;text-align:center;">
    <a href="Files/class/Facility/20190821115944.JPG" onfocus="$('#img12').fadeTo('fast', 0.5)" onblur="$('#img12').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery12" data-transition-effect="circular" data-loop="true"><img src="Files/class/Facility/20190821115944.JPG" alt="艾園(唐式庭園)　20190821115944.JPG" style="max-width:180px;max-height:180px;" id="img12"></a>
    <a href="Files/class/Facility/20190821115955.JPG" onfocus="$('#img13').fadeTo('fast', 0.5)" onblur="$('#img13').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery13" data-transition-effect="circular" data-loop="true"><img src="Files/class/Facility/20190821115955.JPG" alt="艾園(唐式庭園)　20190821115955.JPG" style="max-width:180px;max-height:180px;" id="img13"></a>
    </div><div style="width:100%;display:flex;justify-content:center;padding-top:10px;">本區依基地而布局，講求體宜因借，蒐集多種不同層次的桃、李、松、柳、蕉等植群植物，傳遞傳統林園的氣息，串聯涼亭、窗台、迴廊、曲橋、石景、水榭等，使遊客置身於自然與人文合一的唐式庭園。</div></figure></div>
    <div class="column"><figure><div style="width:100%;text-align:center;color:green;font-size:1.2em;">依莉莎庭園(英式庭園)　</div>
    <div style="width:100%;text-align:center;">
    <a href="Files/class/Facility/20190821120052.JPG" onfocus="$('#img14').fadeTo('fast', 0.5)" onblur="$('#img14').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery14" data-transition-effect="circular" data-loop="true"><img src="Files/class/Facility/20190821120052.JPG" alt="依莉莎庭園(英式庭園)　20190821120052.JPG" style="max-width:180px;max-height:180px;" id="img14"></a>
    <a href="Files/class/Facility/20190821120114.JPG" onfocus="$('#img15').fadeTo('fast', 0.5)" onblur="$('#img15').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery15" data-transition-effect="circular" data-loop="true"><img src="Files/class/Facility/20190821120114.JPG" alt="依莉莎庭園(英式庭園)　20190821120114.JPG" style="max-width:180px;max-height:180px;" id="img15"></a>
    </div><div style="width:100%;display:flex;justify-content:center;padding-top:10px;">英式庭園聞名全世界，其擅於運用園藝手法營造優雅自然的植物庭園，對於現代造園發展有極重的影響。本區選擇適合宜蘭氣候的喬灌木及地被草皮搭配起伏地形、不規則水池，形成多元豐富植物色彩及漸層變化，紅磚屋、玻璃屋及木亭為庭園的視覺焦點，其間步道旁邊境花壇，整體呈現折衷式的英式風格庭園。</div></figure></div>
    <div class="column"><figure><div style="width:100%;text-align:center;color:green;font-size:1.2em;">法蘭西庭園(法式庭園)　</div>
    <div style="width:100%;text-align:center;">
    <a href="Files/class/Facility/20190821120208.JPG" onfocus="$('#img16').fadeTo('fast', 0.5)" onblur="$('#img16').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery16" data-transition-effect="circular" data-loop="true"><img src="Files/class/Facility/20190821120208.JPG" alt="法蘭西庭園(法式庭園)　20190821120208.JPG" style="max-width:180px;max-height:180px;" id="img16"></a>
    <a href="Files/class/Facility/20190821120222.JPG" onfocus="$('#img17').fadeTo('fast', 0.5)" onblur="$('#img17').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery17" data-transition-effect="circular" data-loop="true"><img src="Files/class/Facility/20190821120222.JPG" alt="法蘭西庭園(法式庭園)　20190821120222.JPG" style="max-width:180px;max-height:180px;" id="img17"></a>
    </div><div style="width:100%;display:flex;justify-content:center;padding-top:10px;">法國宮廷花園之幾何平面、織錦花園與樹籬，是所有到過凡爾賽宮旅遊的人最深刻印象。本園已適合宜蘭氣候的花卉及植物，於平坦地形設計繁複華麗對稱式的花壇圖案，配合噴水池、精靈亭、綠籬、雕像、碎石、台階，創造一處吸引各地遊客及藝術家到訪的美景。</div></figure></div>
    <div class="column"><figure><div style="width:100%;text-align:center;color:green;font-size:1.2em;">嵐庭(日式庭園)</div>
    <div style="width:100%;text-align:center;">
    <a href="Files/class/Facility/20190821120345.JPG" onfocus="$('#img18').fadeTo('fast', 0.5)" onblur="$('#img18').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery18" data-transition-effect="circular" data-loop="true"><img src="Files/class/Facility/20190821120345.JPG" alt="嵐庭(日式庭園)20190821120345.JPG" style="max-width:180px;max-height:180px;" id="img18"></a>
    <a href="Files/class/Facility/20190821120416.JPG" onfocus="$('#img19').fadeTo('fast', 0.5)" onblur="$('#img19').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery19" data-transition-effect="circular" data-loop="true"><img src="Files/class/Facility/20190821120416.JPG" alt="嵐庭(日式庭園)20190821120416.JPG" style="max-width:180px;max-height:180px;" id="img19"></a>
    </div><div style="width:100%;display:flex;justify-content:center;padding-top:10px;">日式庭園以石頭、流水及石燈籠等元素，製造簡約而富有禪意的空間；種植於其間的櫻花，使得庭園增添一襲寧靜美感。日式庭園區位於仁山步道末端，庭園區內的涼亭可供步行民眾或學員小憩片刻。</div></figure></div>
    <div class="column"><figure><div style="width:100%;text-align:center;color:green;font-size:1.2em;">台灣庭園植物展示區　</div>
    <div style="width:100%;text-align:center;">
    <a href="Files/class/Facility/20190821121936.JPG" onfocus="$('#img20').fadeTo('fast', 0.5)" onblur="$('#img20').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery20" data-transition-effect="circular" data-loop="true"><img src="Files/class/Facility/20190821121936.JPG" alt="台灣庭園植物展示區　20190821121936.JPG" style="max-width:180px;max-height:180px;" id="img20"></a>
    <a href="Files/class/Facility/20190821121944.JPG" onfocus="$('#img21').fadeTo('fast', 0.5)" onblur="$('#img21').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery21" data-transition-effect="circular" data-loop="true"><img src="Files/class/Facility/20190821121944.JPG" alt="台灣庭園植物展示區　20190821121944.JPG" style="max-width:180px;max-height:180px;" id="img21"></a>
    </div><div style="width:100%;display:flex;justify-content:center;padding-top:10px;">種植許多台灣原生植物，包括早期農業社會台灣庭園中常見的栽植樹種，戶外展示區配合解說教育課程，俾使學員瞭解台灣常見的植物。</div></figure></div>
    <div class="column"><figure><div style="width:100%;text-align:center;color:green;font-size:1.2em;">大航海外來植物展示區</div>
    <div style="width:100%;text-align:center;">
    <a href="Files/class/Facility/20190821122013.JPG" onfocus="$('#img22').fadeTo('fast', 0.5)" onblur="$('#img22').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery22" data-transition-effect="circular" data-loop="true"><img src="Files/class/Facility/20190821122013.JPG" alt="大航海外來植物展示區20190821122013.JPG" style="max-width:180px;max-height:180px;" id="img22"></a>
    <a href="Files/class/Facility/20190821122022.JPG" onfocus="$('#img23').fadeTo('fast', 0.5)" onblur="$('#img23').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery23" data-transition-effect="circular" data-loop="true"><img src="Files/class/Facility/20190821122022.JPG" alt="大航海外來植物展示區20190821122022.JPG" style="max-width:180px;max-height:180px;" id="img23"></a>
    </div><div style="width:100%;display:flex;justify-content:center;padding-top:10px;">栽植台灣常見的外來植物，並將植物依其原屬地所屬，分為南亞區、非洲區、南美區及澳洲區。戶外展示區配合解說教育課程，俾使學員瞭解台灣常見的外來植物。</div></figure></div>
    <div class="column"><figure><div style="width:100%;text-align:center;color:green;font-size:1.2em;">木炭窯　</div>
    <div style="width:100%;text-align:center;">
    <a href="Files/class/Facility/20190821115457.JPG" onfocus="$('#img24').fadeTo('fast', 0.5)" onblur="$('#img24').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery24" data-transition-effect="circular" data-loop="true"><img src="Files/class/Facility/20190821115457.JPG" alt="木炭窯　20190821115457.JPG" style="max-width:180px;max-height:180px;" id="img24"></a>
    <a href="Files/class/Facility/20190821115506.JPG" onfocus="$('#img25').fadeTo('fast', 0.5)" onblur="$('#img25').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery25" data-transition-effect="circular" data-loop="true"><img src="Files/class/Facility/20190821115506.JPG" alt="木炭窯　20190821115506.JPG" style="max-width:180px;max-height:180px;" id="img25"></a>
    </div><div style="width:100%;display:flex;justify-content:center;padding-top:10px;">展示相思樹為台灣早期相當重要的經濟樹種，尤其是製成民生需求量最大的木炭，對於台灣經濟林之發展有相當重要的意義。</div></figure></div>
    <div class="column"><figure><div style="width:100%;text-align:center;color:green;font-size:1.2em;">擋土牆展示區</div>
    <div style="width:100%;text-align:center;">
    <a href="Files/class/Facility/20211115100227.jpg" onfocus="$('#img26').fadeTo('fast', 0.5)" onblur="$('#img26').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery26" data-transition-effect="circular" data-loop="true"><img src="Files/class/Facility/20211115100227.jpg" alt="擋土牆展示區20211115100227.jpg" style="max-width:180px;max-height:180px;" id="img26"></a>
    <a href="Files/class/Facility/20211115100235.jpg" onfocus="$('#img27').fadeTo('fast', 0.5)" onblur="$('#img27').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery27" data-transition-effect="circular" data-loop="true"><img src="Files/class/Facility/20211115100235.jpg" alt="擋土牆展示區20211115100235.jpg" style="max-width:180px;max-height:180px;" id="img27"></a>
    </div><div style="width:100%;display:flex;justify-content:center;padding-top:10px;">展示４種擋土牆型式：加勁擋土牆、石籠擋土牆、三明治擋土牆、keystone擋土牆，每種約8公尺長。</div></figure></div>
    <div class="column"><figure><div style="width:100%;text-align:center;color:green;font-size:1.2em;">坡度體驗區</div>
    <div style="width:100%;text-align:center;">
    <a href="Files/class/Facility/20211115100049.JPG" onfocus="$('#img28').fadeTo('fast', 0.5)" onblur="$('#img28').fadeTo('fast', 1.0)" class="fancybox" data-fancybox="gallery28" data-transition-effect="circular" data-loop="true"><img src="Files/class/Facility/20211115100049.JPG" alt="坡度體驗區20211115100049.JPG" style="max-width:180px;max-height:180px;" id="img28"></a>
    </div><div style="width:100%;display:flex;justify-content:center;padding-top:10px;">依【山坡地保育利用條款】規定，山坡地供農業使用者，依坡度、土壤有效深度、土壤沖蝕程度及母岩性質，實施土地可利用限度分類。坡度5%以上為宜牧地、坡度55%以上為宜林地，需造林、維持自然林木或植生覆蓋，不宜農耕。</div></figure></div>
    <div class="column"><figure><div style="width:100%;text-align:center;color:green;font-size:1.2em;">降雨沖蝕觀察區</div>
    <div style="width:100%;text-align:center;">
