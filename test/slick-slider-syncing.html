<!DOCTYPE html>
<html lang="en">
<head>
  <title>Slick Slider Single Item</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="../css/bootstrap.min.css" rel="stylesheet">

  
  <link rel="stylesheet" href="../css/slick.css" />
  
  <link rel="stylesheet" href="../css/slick-theme.css"/>
  
  <style>

.slick-slide {
      margin: 0 10px;
  }

section 
{
  width: 620px;
    height: 351px;
}

.slick-prev:before, .slick-next:before
{
  color:#000;
}

.slider-for img{
  width: 620px;
height: 351px;
object-fit:cover;

}

.slider-nav img 
{
height:100px;
object-fit:cover;
}

.slick-arrow
{
  display: none;
}

  </style>
  
</head>
<body>


<section >
<div class="slider-for">

<div>
<img src="images/shoe1.jpg" >
</div>

<div>
<img src="images/shoe2.jpg" >
</div>

<div>
<img src="images/shoe3.jpg" >
</div>

<div>
<img src="images/shoe1.jpg">
</div>

<div>
<img src="images/shoe2.jpg" >
</div>

<div>
<img src="images/shoe3.jpg" >
</div>

</div>

<div class="slider-nav">

<div>
<img src="images/shoe1.jpg" >
</div>

<div>
<img src="images/shoe2.jpg" >
</div>

<div>
<img src="images/shoe3.jpg" >
</div>

<div>
<img src="images/shoe1.jpg" >
</div>

<div>
<img src="images/shoe2.jpg" >
</div>

<div>
<img src="images/shoe3.jpg" >
</div>

</div>
</section>

<script src="../js/jquery-3.5.1.min.js"></script>


  <script src="../js/bootstrap.bundle.min.js"></script>
  
  
 <script src="../js/slick.js" ></script> 


<script>
 $('.slider-for').slick({
  slidesToShow: 1,
  slidesToScroll: 1,
  arrows: false,
  fade: true,
  asNavFor: '.slider-nav',
  infinite: false
});


$('.slider-nav').slick({
  slidesToShow: 3,
  slidesToScroll: 1,
  asNavFor: '.slider-for',
  centerMode: false,
  arrows: false,
  focusOnSelect: true,
  infinite: false
});
	
</script>

</body>
</html>
