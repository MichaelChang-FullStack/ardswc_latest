<script>

const embeddedURL="https:\/\/www.google.com\/maps\/embed?pb=!1m16!1m12!1m3!1d14475.224740540254!2d121.1836073703022!3d24.904591858696367!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1z5qGD5ZyS5qWK5qKF6Iy26JGJ5pS56Imv5aC05rC05Zyf5L-d5oyB5oi25aSW5pWZ5a6k!5e0!3m2!1szh-TW!2stw!4v1422238263886";
const regexLatitude = /!3d([-0-9.]+)/;
const regexLongitude = /!2d([-0-9.]+)/;

const latitudeMatches = embeddedURL.match(regexLatitude);
const longitudeMatches = embeddedURL.match(regexLongitude);

if (latitudeMatches && longitudeMatches) {
  const latitude = parseFloat(latitudeMatches[1]);
  const longitude = parseFloat(longitudeMatches[1]);
  console.log("Latitude:", latitude);
  console.log("Longitude:", longitude);
} else {
  console.log("Latitude and/or longitude not found in the URL.");
}
