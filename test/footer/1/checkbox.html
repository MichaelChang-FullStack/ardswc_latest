<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
	box-sizing: border-box;
}

body {
	font-family: "Open Sans", sans-serif;
	accent-color: lime;
	min-height: 100vh;
	display: grid;
	place-items: center;
}

.grid {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr));
	gap: 3rem;
}

.wrapper {
	max-width: 75rem;
	width: 100%;
	padding: min(3rem, 5vw);
}

form {
	padding: 1.5rem;
	background-color: rgba(245, 245, 245);
	border-radius: 0.5rem;
}

legend {
	font-weight: 700;
}

fieldset > * + * {
	margin-top: 0.5rem;
}

form > * + * {
	margin-top: 1.5rem;
}

.form__group {
	display: flex;
	align-items: center;
}

input[type="checkbox"],
input[type="radio"]{
	width: 1.5em;
	height: 1.5em;
	margin-right: 0.65rem;
    accent-color: #467D1E;
}

input[type="range"],
progress {
	margin-left: auto;
	flex: 0 1 50%;
}

form:nth-child(2n) {
	color-scheme: dark;
	background-color: black;
	color: white;
}
    </style>
</head>

<body>
    <div class="wrapper">
        <h1>Accent-color is cool</h1>
        <div class="grid">
            <form action="">
                <fieldset>
                    <legend>Choose your berries</legend>
                    <div class="form__group">
                        <input type="checkbox" id="berries_1" value="strawberries" name="berries">
                        <label for="berries_1">Strawberries</label>
                    </div>
                    <div class="form__group">
                        <input type="checkbox" id="berries_2" value="blueberries" name="berries">
                        <label for="berries_2">Blueberries</label>
                    </div>
                    <div class="form__group">
                        <input type="checkbox" id="berries_3" value="bananas" name="berries">
                        <label for="berries_3">Bananas (yes, they are berries)</label>
                    </div>
                </fieldset>
            </form>
        </div>
    </div>
</body>
</html>
