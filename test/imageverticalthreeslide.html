<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

.Water_Conservation_Theme_Learning
{
    display: flex;
    width: auto;
    height: 300.001px;
    flex-wrap: wrap;
}


.Water_Conservation_Theme_Learning h3
{
    position: absolute;
    color: #FFF;
    text-align: center;
    font-family: Noto Sans CJK TC;
    font-size: 24px;
    font-style: normal;
    font-weight: 700;
    line-height: 36px;
    letter-spacing: 3.84px;
}

.Water_Conservation_Theme_Learningpart1
{
    flex: 1;
    display: flex;
    border-radius: 15px 0px 0px 15px;
    flex-direction: column;
    cursor: pointer;
    white-space: pre-line;
    justify-content: center;
    align-items: center;

}
.Water_Conservation_Theme_Learningpart2
{
    flex: 1;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    white-space: pre-line;
    justify-content: center;
    align-items: center;

}
.Water_Conservation_Theme_Learningpart3
{
    flex: 1;
    display: flex;
    border-radius: 0px 15px 15px 0px;
    flex-direction: column;
    cursor: pointer;
    white-space: pre-line;
    justify-content: center;
    align-items: center;

}
.imgstripvertical1{
  display: flex;
  position: relative;
  border-radius: 15px 0px 0px 15px;
  width: 100%;
  height: -webkit-fill-available;
  flex-direction: column;
  cursor: pointer;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}


.imgstripvertical2{
  display: flex;
  position: relative;
  width: 100%;
  height: -webkit-fill-available;
  flex-direction: column;
  cursor: pointer;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}



.imgstripvertical3 {
  display: flex;
  position: relative;
  width: 100%;
  border-radius: 0px 15px 15px 0px;
  height: -webkit-fill-available;
  flex-direction: column;
  cursor: pointer;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.imgstripvertical1::before,
.imgstripvertical2::before,
.imgstripvertical3::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-repeat: no-repeat;
  filter: brightness(60%);
  transition: transform 0.3s ease;
}

.imgstripvertical1::before {
  background-image: url(../asset/images/Teacher_Edition_Home/Water_Conservation_Theme_Learning_img1.svg);
}

.imgstripvertical2::before {
  background-image: url(../asset/images/Teacher_Edition_Home/Water_Conservation_Theme_Learning_img2.svg);
}

.imgstripvertical3::before {
  background-image: url(../asset/images/Teacher_Edition_Home/Water_Conservation_Theme_Learning_img3.svg);
}

.imgstripvertical1:hover::before,
.imgstripvertical2:hover::before,
.imgstripvertical3:hover::before {
  transform: scale(1.2); 
}



    </style>
</head>
<body>
    <div class="Water_Conservation_Theme_Learning">
        <div class="Water_Conservation_Theme_Learningpart1">
            <div class="imgstripvertical1"> </div>
            <h3 >水
                土
                保
                持</h3>
        </div>

        <div class="Water_Conservation_Theme_Learningpart2">
            <div class="imgstripvertical2"> </div>
            <h3 >土
                石
                流
                防
                災</h3>
        </div>

        <div class="Water_Conservation_Theme_Learningpart3">
            <div class="imgstripvertical3"> </div>
            <h3 >農
                村
                再
                生</h3>
        </div>

    </div>
</body>
</html>
