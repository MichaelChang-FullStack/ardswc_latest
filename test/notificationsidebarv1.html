<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.2.2/jquery.min.js"></script>
    <style>
        .notificationsiderbar1
        {
            display: flex;
            position: fixed;
            right: 0;
            top: 50%;
            /*transform: translateY(-50%);*/
            transform: translatex(85%);
            transition: transform 0.3s ease;
        }

        .notificationsiderbar1_part1
        {
            display: flex;
            flex-direction: column;
            width: 60px;
            height: 180px;
            border-radius: 15px 0px 0px 15px;
            background:  #008756;
            justify-content: center;
            align-items: center ;
            row-gap: 5px;
        }

        .notificationsiderbar1_part11 svg
        {
            width: 30px;
            height: 30px;
        }

        .notificationsiderbar1_part12
        {
            display: flex;
            /* flex-wrap: inherit; */
            white-space: pre-line;
        }

        .notificationsiderbar1_part12 span
        {
            color: #FFF;
            text-align: center;
            font-family: Noto Sans CJK TC;
            font-size: 20px;
            font-style: normal;
            font-weight: 700;
            line-height: 24px; /* 120% */
            letter-spacing: 3.2px;
        }

        .notificationsiderbar1_part13 svg
        {
            width: 24px;
            height: 24px;
        }

        .notificationsiderbar1_part2
        {
            width: 320px;
            height: 180px;
            background: rgba(0, 0, 0, 0.75);
            justify-content: center;
        }

        .notificationsiderbar1_part21 h5 {
    display: block;
    font-size: 0;
    margin-block-start: 0;
    margin-block-end: 0;
    margin-inline-start: 0;
    margin-inline-end: 0;
    font-weight: bold;
}
        .notificationsiderbar1_part21 h5
        {
            color: #FFF;
            text-align: center;
            font-family: Noto Sans CJK TC;
            font-size: 16px;
            font-style: normal;
            font-weight: 700;
            line-height: 24px; /* 150% */
            letter-spacing: 2.56px;
            margin-top: 15px;
            margin-bottom: 15px;

        }

        .notificationsiderbar1_part22
        {
            display: flex;
            flex-wrap: wrap;
            row-gap: 10px;
            column-gap: 10px;
            padding-left: 10px;
            padding-right: 10px;
        }
        
        .notificationsiderbar1_part22_sub
        {
            width: 140px;
            height: 30px;
            flex-shrink: 0;
            border-radius: 15px;
            background: #008756;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .notificationsiderbar1_part22_sub h5{
    display: block;
    font-size: 0;
    margin-block-start: 0;
    margin-block-end: 0;
    margin-inline-start: 0px;
    margin-inline-end: 0px;
    font-weight: bold;
}

        .notificationsiderbar1_part22_sub h5
        {
            color: #FFF;
            text-align: center;
            font-family: Noto Sans CJK TC;
            font-size: 16px;
            font-style: normal;
            font-weight: 400;
            line-height: 24px; /* 150% */
            letter-spacing: 2.56px;
        }

        .notificationsiderbar1 .open {
            transform: translatex(-100%);
}

.notificationsiderbar1_part13 {
  transform: rotate(0deg);
}

.notificationsiderbar1 .open .notificationsiderbar1_part13 {
  transform: rotate(45deg);
}



    </style>
</head>

    <div class="notificationsiderbar1">

                  </svg>
            </div>
            <div class="notificationsiderbar1_part12">
                <span>快
                    速
                    導
                    覽</span>
            </div>
            <div class="notificationsiderbar1_part13">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M20 13H13V20H11V13H4V11H11V4H13V11H20V13Z" fill="white"/>
                </svg>

        </div>
        <div class="notificationsiderbar1_part2" id="sidebar2">
            <div class="notificationsiderbar1_part21">
                    <h5>您想依據什麼分類快速找到內容呢?</h5>
            </div>
            <div class="notificationsiderbar1_part22">

            </div>

        </div>

    </div>
</body>
</html>

<script>
    const sidebar1 = document.getElementById("sidebar1");
const sidebar2 = document.getElementById("sidebar2");

sidebar1.addEventListener("click", function () {
  sidebar1.classList.toggle("open");
  sidebar2.classList.toggle("open");
});

</script>
