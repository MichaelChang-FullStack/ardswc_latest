<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://npmcdn.com/flickity@2/dist/flickity.pkgd.js"></script>
  <style>
.flickity-enabled {
  position: relative;
}

.flickity-enabled:focus { outline: none; }

.flickity-viewport {
  overflow: hidden;
  position: relative;
  height: 100%;
}
.flickity-slider {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: row;
    column-gap: 10px;
}

.flickity-enabled.is-draggable {
  -webkit-tap-highlight-color: transparent;
          tap-highlight-color: transparent;
  -webkit-user-select: none;
     -moz-user-select: none;
      -ms-user-select: none;
          user-select: none;
}

.flickity-enabled.is-draggable .flickity-viewport {
  cursor: move;
  cursor: -webkit-grab;
  cursor: grab;
}

.flickity-enabled.is-draggable .flickity-viewport.is-pointer-down {
  cursor: -webkit-grabbing;
  cursor: grabbing;
}

/* ---- previous/next buttons ---- */

.flickity-prev-next-button {
  position: absolute;
  top: 50%;
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 50%;
  background: white;
  background: hsla(0, 0%, 100%, 0.75);
  cursor: pointer;
  /* vertically center */
  -webkit-transform: translateY(-50%);
          transform: translateY(-50%);
}

.flickity-prev-next-button:hover { background: white; }

.flickity-prev-next-button:focus {
  outline: none;
  box-shadow: 0 0 0 5px #09F;
}

.flickity-prev-next-button:active {
  opacity: 0.6;
}

.flickity-prev-next-button.previous { left: 10px; display: none;}
.flickity-prev-next-button.next { right: 10px;display: none; }
.flickity-prev-next-button:disabled {
  opacity: 0.3;
  cursor: auto;
}

.flickity-prev-next-button svg {
  position: absolute;
  left: 20%;
  top: 20%;
  width: 60%;
  height: 60%;
}

.flickity-prev-next-button .arrow {
  fill: #333;
}



* { box-sizing: border-box; }

body { font-family: sans-serif; }

.carousel {
  background: #FAFAFA;
}

.carousel-main {
  margin-bottom: 8px;
}

.carousel-cell {
  width: 100%;
  height: 351px;
  background: #8C8;
  border-radius: 15px;
  /* counter-increment: carousel-cell; */
}
.carousel-cell  img{
  height: 100%;
  width: 100%;
  border-radius: 15px;
}


.carousel-nav .carousel-cell {
  width: 160px;
  height: 90px;
  margin-right: 10px;
  border-radius: 15px;
}


.carousel-main img {
  display: block;
  margin: 0 auto; 
  width: 100%;
  height: 100%;
}

.container {
    max-width: 620px;
    width: 100%;
    /* height: 351px; */
    margin: 0 auto;
}

h1 {
  text-align: center;
}

.is-nav-selected{
  border: 2px solid red;
}

.carousel-nav .carousel-cell:last-child {
      margin-right: 0;
    }

  </style>
</head>
<body>
  <h1>Image slider with Thumbnails and Flickity - asNavFor</h1>

<div class="container">
<!-- Flickity HTML init -->
<div class="carousel carousel-main" data-flickity='{"pageDots": false }'>
  <div class="carousel-cell"><img src="images/shoe1.jpg"/></div>
  <div class="carousel-cell"><img src="images/shoe2.jpg"/></div>
  <div class="carousel-cell"><img src="images/shoe3.jpg"/></div>
  <div class="carousel-cell"><img src="images/shoe1.jpg"/></div>
  <div class="carousel-cell"><img src="images/shoe2.jpg"/></div>
  <div class="carousel-cell"><img src="images/shoe3.jpg"/></div>
  <div class="carousel-cell"><img src="images/shoe1.jpg"/></div>
  <div class="carousel-cell"><img src="images/shoe2.jpg"/></div>
  <div class="carousel-cell"><img src="images/shoe3.jpg"/></div>
</div>

<div class="carousel carousel-nav"
  data-flickity='{ "asNavFor": ".carousel-main", "contain": true, "pageDots": false }'>

  <div class="carousel-cell"><img src="images/shoe2.jpg"/></div>
  <div class="carousel-cell"><img src="images/shoe3.jpg"/></div>
  <div class="carousel-cell"><img src="images/shoe1.jpg"/></div>
  <div class="carousel-cell"><img src="images/shoe2.jpg"/></div>
  <div class="carousel-cell"><img src="images/shoe3.jpg"/></div>
  <div class="carousel-cell"><img src="images/shoe1.jpg"/></div>
  <div class="carousel-cell"><img src="images/shoe2.jpg"/></div>
  <div class="carousel-cell"><img src="images/shoe3.jpg"/></div>
</div>

</div>
</body>
</html>
