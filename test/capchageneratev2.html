<!DOCTYPE html>
<html>
<head>
    <title>HTML Captcha Example</title>
    <style>
        #captcha {
            font-family: Arial, sans-serif;
            font-size: 24px;
            font-weight: bold;
            width: 200px;
            height: 50px;
            line-height: 50px;
            background-color: #f5f5f5;
            border: 1px solid #ccc;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        #captcha-label {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            text-align: center;
            background-color: #f5f5f5;
            color: #888;
            transition: transform 0.5s ease;
        }

        #captcha-regenerate {
            display: block;
            margin-top: 10px;
        }
    </style>
     <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

</head>
<body>
    <div id="captcha">
        <label id="captcha-label"></label>
    </div>
    <button id="speak">Speak</button>
    <audio id="audio"></audio>

    <button id="captcha-regenerate"' onclick="regenerateCaptcha()"'>Regenerate</button>

    <script>
        function generateRandomValue() {
            var uppercaseCharacters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            var lowercaseCharacters = 'abcdefghijklmnopqrstuvwxyz';
            var numbers = '0123456789';

            var char1 = uppercaseCharacters.charAt(Math.floor(Math.random() * uppercaseCharacters.length));
            var char2 = numbers.charAt(Math.floor(Math.random() * numbers.length));
            var char3 = lowercaseCharacters.charAt(Math.floor(Math.random() * lowercaseCharacters.length));
            var char4 = numbers.charAt(Math.floor(Math.random() * numbers.length));

            var captchaValue = [char1, char2, char3, char4];
            var captcha = shuffleArray(captchaValue).join('');

            return captcha;
        }

        function shuffleArray(array) {
            var currentIndex = array.length, temporaryValue, randomIndex;

            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex -= 1;

                temporaryValue = array[currentIndex];
                array[currentIndex] = array[randomIndex];
                array[randomIndex] = temporaryValue;
            }

            return array;
        }

        function regenerateCaptcha() {
            var captchaLabel = document.getElementById('captcha-label');
            captchaLabel.innerHTML = generateRandomValue();
        }

        // Initial captcha generation
        regenerateCaptcha();
    </script>

<script>

$(document).ready(function() {
    $('#speak').click(function() {
        var text = document.getElementById("captcha-label").innerHTML;
        fetchSpeech(text);
    });

    $('#captcha-regenerate').click(function() {
        stopAudio(function() {
            regenerateCaptcha();
        });
    });
});

var isPlaying = false; // Flag to track audio playback status

function fetchSpeech(text) {
    /*var data = {
        input: { text: text },
        voice: { languageCode: 'en-US', ssmlGender: 'NEUTRAL' },
        audioConfig: { audioEncoding: 'MP3' },
    };*/
    var data = {
                input: { text: text },
                voice: { languageCode: 'cmn-TW', ssmlGender: 'NEUTRAL' },
                audioConfig: { audioEncoding: 'MP3' },
            };

    var characters = text.split(''); // Split the text into individual characters

    var audio = document.getElementById('audio');

    function playNextCharacter(index) {
        if (index >= characters.length) {
            isPlaying = false; // Set the flag to indicate playback finished
            return; // Finished playing all characters
        }

        var currentCharacter = characters[index];
        var isUpperCase = currentCharacter === currentCharacter.toUpperCase();

        data.input.text = currentCharacter; // Set the current character in the data object
        data.voice.ssmlGender = isUpperCase ? 'MALE' : 'FEMALE'; // Use MALE voice for uppercase, FEMALE voice for lowercase

        $.ajax({
            type: 'POST',
            url: 'https://texttospeech.googleapis.com/v1/text:synthesize?key=AIzaSyBm7vO5EBLe9rT-4RmEHhb3f5-ExfU13Mc',
            data: JSON.stringify(data),
            headers: {
                'Content-Type': 'application/json'
            },
            success: function(response) {
                audio.src = 'data:audio/mp3;base64,' + response.audioContent;
                audio.play();
                isPlaying = true; // Set the flag to indicate playback started

                // Play the next character after a delay (adjust the delay duration as needed)
                setTimeout(function() {
                    playNextCharacter(index + 1);
                }, 1000); // Delay between playing each character (1 second in this example)
            }
        });
    }

    // Start playing the characters one by one
    playNextCharacter(0);
}

function stopAudio(callback) {
    var audio = document.getElementById('audio');
    audio.pause();
    audio.currentTime = 0;

    if (typeof callback === 'function') {
        callback();
    }
}

// Check if audio is playing on interval and stop playback if necessary
setInterval(function() {
    if (!isPlaying) {
        stopAudio();
    }
}, 100); // Interval check every 100 milliseconds

</script>

</body>
</html>
