<!DOCTYPE html>
<html>
<head>
    <title>HTML Captcha Example</title>
    <style>
        #captcha {
            font-family: Arial, sans-serif;
            font-size: 24px;
            font-weight: bold;
            width: 200px;
            height: 50px;
            line-height: 50px;
            background-color: #f5f5f5;
            border: 1px solid #ccc;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        #captcha-label {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            text-align: center;
            background-color: #f5f5f5;
            color: #888;
            transition: transform 0.5s ease;
        }

        #captcha-regenerate {
            display: block;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="captcha">
        <label id="captcha-label">A1bC</label>
    </div>
    <button id="captcha-regenerate" onclick="regenerateCaptcha()">Regenerate</button>

    <script>
        function generateRandomValue() {
            var characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
            var number = Math.floor(Math.random() * 10); // Random number between 0 and 9
            var char1 = characters.charAt(Math.floor(Math.random() * characters.length));
            var char2 = characters.charAt(Math.floor(Math.random() * characters.length));
            var char3 = characters.charAt(Math.floor(Math.random() * characters.length));

            return char1 + number + char2 + char3;
        }

        function regenerateCaptcha() {
            var captchaLabel = document.getElementById('captcha-label');
            captchaLabel.innerHTML = generateRandomValue();
        }

        // Initial captcha generation
        regenerateCaptcha();
    </script>
</body>
</html>
