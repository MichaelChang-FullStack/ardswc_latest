<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       .informationcontainer {
  position: relative;
  width: 100%;
  margin: 20px auto;
}

.informationinformationtabs {
  position: relative;
  display: flex;
  align-items: center;
}

.informationtab {
  cursor: pointer;
  padding: 5px 10px;
  background-color: #f0f0f0;
  margin-right: 5px;
  position: relative;
}

.informationgreen-line {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 5px;
  background-color: green;
  width: 0;
  transition: width 0.3s, left 0.3s;
  z-index: 1;
}

.informationblack-line {
  position: absolute;
  bottom: 2px;
  left: 0;
  height: 2px;
  background-color: black;
  width: 100%;
}


.information_detail_content1-info,
.information_detail_content2-info,
.information_detail_content3-info {
  display: none;
}

.active-info {
  display: block;
}

    </style>
</head>
<body>
  <div class="informationcontainer">
    <div class="informationinformationtabs">
      <div class="informationtab information_detail_content1-informationtab active" data-target="information_detail_content1-info">
        <h4 class="information_title">簡介</h4>
      </div>
      <div class="informationtab information_detail_content2-informationtab" data-target="information_detail_content2-info">
        <h4 class="information_title">教學目標</h4>
      </div>
      <div class="informationtab information_detail_content3-informationtab" data-target="information_detail_content3-info">
        <h4 class="information_title">教學資源</h4>
      </div>
      <div class="informationgreen-line"></div>
      <div class="informationblack-line"></div>
    </div>
  
    <div class="information_detail_content1-info active-info">
      <p>This is the information_detail_content1 information.</p>
    </div>
  
    <div class="information_detail_content2-info">
      <p>This is the information_detail_content2 information.</p>
    </div>
  
    <div class="information_detail_content3-info">
      <p>This is the information_detail_content3 information.</p>
    </div>
  </div>
  

  
  
      
</body>
<script src="../js/jquery.min.js"></script>
<script>
  $(document).ready(function() {
    const informationinformationtabs = $(".informationtab");
    const greenLine = $(".informationgreen-line");

    function adjustGreenLine() {
      const activeinformationtab = $(".informationtab.active");
      greenLine.css({
        width: activeinformationtab.outerWidth(),
        left: activeinformationtab.position().left
      });
    }

    informationinformationtabs.on("click", function() {
      const target = $(this).data("target"); // Use the data-target attribute value
      const activeinformationtab = $(".informationtab.active");

      if (!$(this).hasClass("active")) {
        const direction = activeinformationtab.index() < $(this).index() ? "right" : "left";
        const infoDirection = direction === "right" ? "-100%" : "100%";

        activeinformationtab.removeClass("active");
        $(this).addClass("active");

        const activeInfo = $(".active-info");
        const targetInfo = $("." + target); // Use the data-target attribute value

        activeInfo.animate({ left: infoDirection }, 300, function() {
          activeInfo.removeClass("active-info").hide();
          targetInfo.css("left", infoDirection).show().animate(
            { left: "0%" },
            300,
            function() {
              targetInfo.addClass("active-info");
            }
          );
        });

        adjustGreenLine();
      }
    });

    // Set the first tab and its content as active by default
    $(".informationtab:first-child").addClass("active");
      $(".information_detail_content1-info").addClass("active-info");

      // Call the adjustGreenLine function on page load to set the initial position of the green line
      adjustGreenLine();

      informationinformationtabs.on("click", function() {
        // ... Rest of the click event handling (unchanged) ...
      });


    $(window).resize(function() {
      adjustGreenLine();
    });
  });
</script>


</html>
