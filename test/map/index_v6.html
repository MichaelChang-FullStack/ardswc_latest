<html>

<head>
	<title>Google Multiple Custom Markers</title>
	<script src="https://maps.google.com/maps/api/js?sensor=false" type="text/javascript"></script>
	<link rel="stylesheet" type="text/css" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css">
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.2.2/jquery.min.js"></script>
	<style>
		#map {
  height: 500px;
  width: 100%;
}
	</style>
</head>

<body>
    <div>
        <label><input type="checkbox" id="allCheckbox" checked>All</label>
        <label><input type="checkbox" id="location1Checkbox" checked>Location 1</label>
        <label><input type="checkbox" id="location2Checkbox" checked>Location 2</label>
        <label><input type="checkbox" id="location3Checkbox" checked>Location 3</label>
    </div>
  	<div id="map"></div>
</body>

</html>

<script>
    var locations = [
        ['<div><b>Paris,</b><br> La cité des Titis</div><button class="info-button" onclick="showInfoWindow(this)">Show Info</button>', 48.8588377, 2.2770197, 1, "http://www.aviewoncities.com/img/paris/nav_paris_icon.png"],
        ['<div><b>Lyon,</b><br> La cité des Gones</div><button class="info-button" onclick="showInfoWindow(this)">Show Info</button>', 45.7579341, 4.7650806, 2, "https://maps.google.com/mapfiles/ms/micons/green.png"],
        ['<div><b>Marseille,</b><br> La cité des Minos</div><button class="info-button" onclick="showInfoWindow(this)">Show Info</button>', 43.2803051, 5.2404104, 3, "https://maps.google.com/mapfiles/ms/micons/blue.png"]
    ];
    var map = new google.maps.Map(document.getElementById('map'), {
        zoom: 5,
        center: new google.maps.LatLng(43.2803051, 5.2404104),
        mapTypeId: google.maps.MapTypeId.ROADMAP
    });
    var infowindow = new google.maps.InfoWindow();
    var marker, i;
    var activeMarker = null; // To keep track of active marker

    var checkboxes = {
        all: document.getElementById('allCheckbox'),
        location1: document.getElementById('location1Checkbox'),
        location2: document.getElementById('location2Checkbox'),
        location3: document.getElementById('location3Checkbox')
    };

    var markers = []; // Define markers array
    for (i = 0; i < locations.length; i++) {
        marker = new google.maps.Marker({
            position: new google.maps.LatLng(locations[i][1], locations[i][2]),
            icon: locations[i][4],
            map: map
        });
        markers.push(marker); // Add marker to markers array
        
        google.maps.event.addListener(marker, 'click', (function (marker, i) {
            return function () {
                infowindow.setContent(locations[i][0]);
                infowindow.open(map, marker);
                activeMarker = marker;
            }
        })(marker, i));

		google.maps.event.addListener(marker, 'mouseover', (function (marker, i) {
            return function () {
                infowindow.setContent(locations[i][0]);
                infowindow.open(map, marker);
                activeMarker = marker; // Set the active marker
            
            }
        })(marker, i));
    }
    
        // Checkbox event handlers
        checkboxes.all.addEventListener('change', function () {
        for (var key in checkboxes) {
            if (key !== 'all') {
                checkboxes[key].checked = checkboxes.all.checked;
            }
        }
        updateMarkerVisibility();
    });

    checkboxes.location1.addEventListener('change', function () {
        updateMarkerVisibility();
    });

    checkboxes.location2.addEventListener('change', function () {
        updateMarkerVisibility();
    });

    checkboxes.location3.addEventListener('change', function () {
        updateMarkerVisibility();
    });

    function updateMarkerVisibility() {
        for (var i = 0; i < locations.length; i++) {
            var checkbox = checkboxes['location' + (i + 1)];
            marker = markers[i];
            if (checkbox.checked) {
                marker.setVisible(true);
            } else {
                marker.setVisible(false);
            }
        }
        infowindow.close();
    }
    // Function to open InfoWindow and prevent it from closing on mouseout
    function showInfoWindow(button) {
        var content = button.parentNode.innerHTML;
        infowindow.setContent(content);
        infowindow.open(map, infowindow.anchor);
    }
</script>
