    var map = new google.maps.Map(document.getElementById('map'), {
        zoom: 10,
        center: new google.maps.LatLng(23.6978, 120.9605), // Centered on Taiwan
        mapTypeId: google.maps.MapTypeId.ROADMAP
    });
    var infowindow = new google.maps.InfoWindow();
    var marker, i;
    var activeMarker = null; // To keep track of active marker

    var checkboxes = {
        all: document.getElementById('allCheckbox'),
        location1: document.getElementById('location1Checkbox'),
        location2: document.getElementById('location2Checkbox'),
        location3: document.getElementById('location3Checkbox')
    };

    var markers = []; // Define markers array
    for (i = 0; i < locations.length; i++) {
        marker = new google.maps.Marker({
            position: new google.maps.LatLng(locations[i][1], locations[i][2]),
            icon: locations[i][4],
            map: map
        });
        markers.push(marker); // Add marker to markers array

        google.maps.event.addListener(marker, 'click', (function (marker, i) {
            return function () {
                infowindow.setContent(locations[i][0]);
                infowindow.open(map, marker);
                activeMarker = marker;
            }
        })(marker, i));

        google.maps.event.addListener(marker, 'mouseover', (function (marker, i) {
            return function () {
                infowindow.setContent(locations[i][0]);
                infowindow.open(map, marker);
                activeMarker = marker; // Set the active marker

            }
        })(marker, i));
    }

    // Checkbox event handlers
    checkboxes.all.addEventListener('change', function () {
        for (var key in checkboxes) {
            if (key !== 'all') {
                checkboxes[key].checked = checkboxes.all.checked;
            }
        }
        updateMarkerVisibility();
    });

    checkboxes.location1.addEventListener('change', function () {
        updateMarkerVisibility();
    });

    checkboxes.location2.addEventListener('change', function () {
        updateMarkerVisibility();
    });

    checkboxes.location3.addEventListener('change', function () {
        updateMarkerVisibility();
    });

    function updateMarkerVisibility() {
        for (var i = 0; i < locations.length; i++) {
            var checkbox = checkboxes['location' + (i + 1)];
            marker = markers[i];
            if (checkbox.checked) {
                marker.setVisible(true);
            } else {
                marker.setVisible(false);
            }
        }
        infowindow.close();
    }
    // Function to open InfoWindow and prevent it from closing on mouseout
    function showInfoWindow(button) {
        var content = button.parentNode.innerHTML;
        infowindow.setContent(content);
        infowindow.open(map, infowindow.anchor);
    }
