<!DOCTYPE html>
<html lang="en">
<head>
  <title>Slick Slider Single Item</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="../css/bootstrap.min.css" rel="stylesheet">

  
  <link rel="stylesheet" href="../css/slick.css" />
  
  <link rel="stylesheet" href="../css/slick-theme.css"/>
  
  <style>

.slick-slide {
      margin: 0 10px;
  }

section 
{
  width: 620px;
    height: 351px;
}

.slick-prev:before, .slick-next:before
{
  color:#000;
}

.slider-for img{
  width: 620px;
height: 351px;
object-fit:cover;

}

.slider-nav img 
{
height:100px;
object-fit:cover;
}

.slick-arrow
{
  display: none;
}

.slick-current img {
      border: 2px solid red;
    }
  </style>
  
</head>
<body>


<section >
<div class="slider-for">

<div>
<img src="images/shoe1.jpg" >
</div>

<div>
<img src="images/shoe2.jpg" >
</div>

<div>
<img src="images/shoe3.jpg" >
</div>

<div>
<img src="images/shoe1.jpg">
</div>

<div>
<img src="images/shoe2.jpg" >
</div>

<div>
<img src="images/shoe3.jpg" >
</div>

</div>

<div class="slider-nav">

<div>
<img src="images/shoe1.jpg" >
</div>

<div>
<img src="images/shoe2.jpg" >
</div>

<div>
<img src="images/shoe3.jpg" >
</div>

<div>
<img src="images/shoe1.jpg" >
</div>

<div>
<img src="images/shoe2.jpg" >
</div>

<div>
<img src="images/shoe3.jpg" >
</div>

</div>
</section>

<script src="../js/jquery-3.5.1.min.js"></script>


  <script src="../js/bootstrap.bundle.min.js"></script>
  
  
 <script src="../js/slick.js" ></script> 


<script>
  
  $('.slider-for').slick({
      slidesToShow: 1,
      slidesToScroll: 1,
      arrows: false,
      fade: true,
      asNavFor: '.slider-nav',
      infinite: false
    });

    
    
    // Add custom event listeners to handle thumbnail navigation
    
    $('.slider-nav').on('click', '.slick-slide', function() {
      var currentSlideIndex = $('.slider-nav').slick('slickCurrentSlide');
      var clickedSlideIndex = $(this).data('slick-index');
      console.log($(this))
      var numVisibleThumbnails = 3; // Number of thumbnails visible at a time
      var numSlides = $('.slider-nav').slick('getSlick').slideCount;
      var centerValue = !(currentSlideIndex === 0 || currentSlideIndex === numSlides - 1);
      console.log(currentSlideIndex);
      console.log(clickedSlideIndex);
      console.log(numSlides);
      console.log(centerValue);

      // Set centerMode based on whether the current image is the first or last image

      // Scroll the thumbnail slider based on the clicked image index

      if(clickedSlideIndex!=0 && clickedSlideIndex!=1 )
      {
        console.log('if');
      if (clickedSlideIndex > currentSlideIndex) {
        // Clicked on an image to the right of the current active image
        var scrollToIndex = Math.min(clickedSlideIndex + 1, numSlides - numVisibleThumbnails);
        $('.slider-nav').slick('slickGoTo', scrollToIndex);
      } else if (clickedSlideIndex < currentSlideIndex) {
        // Clicked on an image to the left of the current active image
        var scrollToIndex = Math.max(clickedSlideIndex - 1, 0);
        $('.slider-nav').slick('slickGoTo', scrollToIndex);
      }
      else
      {
      $('.slider-nav').slick('slickSetOption', 'centerMode', centerValue);

      }
    }
    });



    $('.slider-nav').slick({
      slidesToShow: 3,
      slidesToScroll: 1,
      asNavFor: '.slider-for',// Initially set to false to avoid centering the first image
      centerMode: false,
      centerPadding: '0', // Remove padding for centerMode
      arrows: false,
      focusOnSelect: true,
      infinite: false
    });


    </script>

</body>
</html>
