<html lang="en">

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.2.2/jquery.min.js"></script>
    <style>
        .notificationswitchsiderbar1
        {
            display: flex;
            position: fixed;
            right: 0;
            top: 50%;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .notificationswitchsiderbar1_part1
        {
            display: flex;
            flex-direction: column;
            width: 60px;
            height: 180px;
            border-radius: 15px 0px 0px 15px;
            background:  #467D1E;
            justify-content: center;
            align-items: center ;
            row-gap: 5px;
        }

        .notificationswitchsiderbar1_part11 svg
        {
            width: 30px;
            height: 30px;
        }

        .notificationswitchsiderbar1_part12
        {
            display: flex;
            /* flex-wrap: inherit; */
            white-space: pre-line;
        }

        .notificationswitchsiderbar1_part12 span
        {
            color: #FFF;
            text-align: center;
            font-family: Noto Sans CJK TC;
            font-size: 20px;
            font-style: normal;
            font-weight: 700;
            line-height: 24px; /* 120% */
            letter-spacing: 3.2px;
        }

        .notificationswitchsiderbar1_part13 svg
        {
            width: 24px;
            height: 24px;
        }

@media screen and (max-width: 500px) {
  .notificationswitchsiderbar1 {
    flex-direction: column;
    height: auto;
    width: 100%;
    transform: translatex(0%);
    border-radius: 15px 15px 15px 15px;
    padding-bottom: 10px;
    position: relative;
  }

  .notificationswitchsiderbar1_part12 {
    display: flex;
    flex-wrap: inherit;
    white-space: normal;
}
  .notificationswitchsiderbar1.open {
    height: 100%;
  }

  .notificationswitchsiderbar1_part1 {
    height: 60px;
    width: 100%;
    border-radius: 15px 15px 15px 15px;
    flex-direction: row;
    column-gap: 10px;
    justify-content: normal;
}

.notificationswitchsiderbar1_part11
{
    position: relative;
    padding-left: 10px;
}

.notificationswitchsiderbar1_part13
{
    display: flex;
    justify-content: normal;
    position: absolute;
    right: 10px;
}

 
}

    </style>
</head>
