<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

.resource_learning
{
    display: flex;
    width: auto;
    height: auto;
    flex-direction: row;
    column-gap: 24px;
}


.resource_learning h3
{
    position: absolute;
    color: #FFF;
    text-align: center;
    font-family: Noto Sans CJK TC;
    font-size: 24px;
    font-style: normal;
    font-weight: 700;
    line-height: 36px;
    letter-spacing: 3.84px;
}
.resource_learningpart1{
  display: flex;
  flex-direction: column;
  cursor: pointer;
  white-space: pre-line;
  justify-content: center;
  align-items: center;
  width: 17.5vw;
  height: 17.5vw;
  border-radius: 50%;
  overflow: hidden;
  margin-top: 60px;
}



.resource_learningpart2 {
  display: flex;
  flex-direction: column;
  cursor: pointer;
  white-space: pre-line;
  justify-content: center;
  align-items: center;
  width: 17.5vw;
  height: 17.5vw;
  border-radius: 50%;
  overflow: hidden;
}

.resource_learningpart3{
  display: flex;
  flex-direction: column;
  cursor: pointer;
  white-space: pre-line;
  justify-content: center;
  align-items: center;
  width: 17.5vw;
  height: 17.5vw;
  border-radius: 50%;
  overflow: hidden;
  margin-top: 60px;
}



.resource_learningpart4 {
  display: flex;
  flex-direction: column;
  cursor: pointer;
  white-space: pre-line;
  justify-content: center;
  align-items: center;
  width: 17.5vw;
  height: 17.5vw;
  border-radius: 50%;
  overflow: hidden;
}



.imagecercleslide1,
.imagecercleslide2,
.imagecercleslide3,
.imagecercleslide4 {
  display: flex;
  position: relative;
  width: 100%;
  height: 100%;
  max-width: 17.5vw;
  max-height: 17.5vw;
  flex-direction: column;
  cursor: pointer;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  border-radius: 50%;
}


.imagecercleslide1::before,
.imagecercleslide2::before,
.imagecercleslide3::before,
.imagecercleslide4::before  {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-repeat: no-repeat;
  filter: brightness(60%);
  transition: transform 0.3s ease;
  border-radius: 50%;
}

.imagecercleslide1::before {
  background-image: url(../asset/images/Teacher_Edition_Home/resource_learning_img1.svg);
}

.imagecercleslide2::before {
  background-image: url(../asset/images/Teacher_Edition_Home/resource_learning_img2.svg);
}

.imagecercleslide3::before {
  background-image: url(../asset/images/Teacher_Edition_Home/resource_learning_img3.svg);
}

.imagecercleslide4::before {
  background-image: url(../asset/images/Teacher_Edition_Home/resource_learning_img4.svg);
}

.resource_learningpart1:hover .imagecercleslide1::before,
.resource_learningpart2:hover .imagecercleslide2::before, 
.resource_learningpart3:hover .imagecercleslide3::before,
.resource_learningpart4:hover .imagecercleslide4::before  {
  transform: scale(1.2); 
}



    </style>
</head>
<body>
    <div class="resource_learning">
        <div class="resource_learningpart1">
            <div class="imagecercleslide1"> </div>
            <h3 >圖書</h3>
        </div>

        <div class="resource_learningpart2">
            <div class="imagecercleslide2"> </div>
            <h3 >教材</h3>
        </div>

        <div class="resource_learningpart3">
            <div class="imagecercleslide3"> </div>
            <h3 >教案</h3>
        </div>

        <div class="resource_learningpart4">
          <div class="imagecercleslide4"> </div>
          <h3 >影片</h3>
      </div>

    </div>
</body>
</html>
