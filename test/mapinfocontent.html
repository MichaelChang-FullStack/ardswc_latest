<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .map_info
        {
            display: flex;
            flex-direction: column;
            width: 235px ;
            height: fit-content;
        }
        .map_info_part1
        {
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 100%;
            align-items: center;
            column-gap: 5px;
            padding-top: 13px;
        }
        .map_info_part1_new1
        {
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 100%;
            align-items: center;
            column-gap: 5px;
            padding-top: 8px;
        }

        .map_info_part1_new2
        {
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 100%;
            align-items: center;
            column-gap: 5px;
            padding-top: 4px;
        }

        .map_info_part1_new3
        {
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 100%;
            align-items: center;
            column-gap: 5px;
            padding-top: 5px;
        }

        .map_info_part2
        {
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            padding-top: 15px;
        }
        .map_info_part11
        {
            display: flex;
            width: auto;
            height: auto;
        }
        .map_title_img
        {
            width: 30px;
            height: 30px;
        }
        .map_contact_img
        {
            width: 20px;
            height: 20px;
        }
        .mapinfo_title
        {
            color: #000;
            font-family: Noto Sans CJK TC;
            font-size: 16px;
            font-style: normal;
            font-weight: 700;
            letter-spacing: 2.56px;
        }
        .mapinfo_discription
        {
            color: #000;
            font-family: Noto Sans CJK TC;
            font-size: 14px;
            font-style: normal;
            font-weight: 400;
            letter-spacing: 2.24px; 
            
        }
        .mapinfo_contact_detail
        {
            color: #000;
            font-family: Noto Sans CJK TC;
            font-size: 14px;
            font-style: normal;
            font-weight: 400;
            line-height: 21px; /* 150% */
            letter-spacing: 2.24px;

        }
        .map_info_button
        {
            width: 100%;
            height: 35px;
            border-radius: 5px;
            background: #467D1E;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .map_info_button_name
        {
            color: #FFF;
            text-align: center;
            font-family: Noto Sans CJK TC;
            font-size: 16px;
            font-style: normal;
            font-weight: 700;
            line-height: 24px; /* 150% */
            letter-spacing: 2.56px;
        }
        .map_info h5
        {
            margin-block-start: 0;
            margin-block-end: 0;
            margin-inline-start: 0px;
            margin-inline-end: 0px;
        }

    </style>
</head>
<body>
    <div class="map_info">
        <div class="map_info_part1">
            <div class="map_info_part11">
                <img class='map_title_img' src="../asset/images/Fun_Outdoor_Teaching_Classroom_Map/info_icon1_title.svg" alt="info_icon1_title">
            </div>
            <div class="map_info_part12">
                <h5 class="mapinfo_title">臺北北投貴子坑</h5>
            </div>
        </div>
        <div class="map_info_part1_new1">
            <div class="map_info_part12">
                <h5 class="mapinfo_discription">臺北市政府工務局大地工程處</h5>
            </div>
        </div>
        <div class="map_info_part1_new2">
            <div class="map_info_part11">
                <img class='map_contact_img' src="../asset/images/Fun_Outdoor_Teaching_Classroom_Map/info_icon2_phone.svg" alt="info_icon2_phone">
            </div>
            <div class="map_info_part12">
                <h5 class="mapinfo_contact_detail">(03)9251000分機1060</h5>
            </div>
        </div>
        <div class="map_info_part1_new3">
            <div class="map_info_part11">
                <img class='map_contact_img' src="../asset/images/Fun_Outdoor_Teaching_Classroom_Map/info_icon3_email.svg" alt="info_icon3_email">
            </div>
            <div class="map_info_part12">
                <h5 class="mapinfo_contact_detail">joanabc@mail.e-land.gov.tw</h5>
            </div>
        </div>
        <div class="map_info_part2">
            <div class="map_info_button" onclick="referenceportal();"><h5 class="map_info_button_name">詳細資訊</h5></div>
        </div>
    </div>
</body>
</html>
