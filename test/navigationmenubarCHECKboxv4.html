<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidebar menu With Sub-menus | Using HTML, CSS & JQuery</title>
  <style media="screen">

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      min-height: 100vh;
      background: rgb(255, 255, 255);
      color: rgb(0, 0, 0);
      background-size: cover;
      background-position: center;
    }

    .menu::-webkit-scrollbar {
      width: 0px;
    }

    h1 {
      text-align: center;
      font-weight: 500;
      font-size: 25px;
      padding-bottom: 13px;
      font-family: sans-serif;
      letter-spacing: 2px;
    }

    .menu {
      width: 100%;
      margin-top: 30px;
    }

    .menu .item {
      position: relative;
      cursor: pointer;
    }

    .menu .item a {
      color: #000000;
      font-size: 16px;
      text-decoration: none;
      display: block;
      padding: 5px 30px;
      line-height: 60px;
    }

    .menu .item a:hover {
      transition: 0.3s ease;
    }

    .menu .item i {
      margin-right: 15px;
    }

    .menu .item a .dropdown {
      position: absolute;
      right: 0;
      margin: 20px;
      transition: 0.3s ease;
    }

    .menu .item .sub-menu {
      display: none;
      margin-left: 20px;
    }

    .menu .item .sub-menu a {
      padding-left: 80px;
    }

    .rotatebefore {
      transform: rotate(0deg);
    }

    .rotateafter {
      transform: rotate(180deg);
    }

    .close-btn {
      position: absolute;
      color: #000000;
      font-size: 23px;
      right: 0px;
      margin: 15px;
      cursor: pointer;
    }

    .menu-btn {
      position: absolute;
      color: rgb(0, 0, 0);
      font-size: 35px;
      margin: 25px;
      cursor: pointer;
    }

    .main {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 50px;
    }

    .main h1 {
      color: rgba(0, 0, 0, 0.8);
      font-size: 60px;
      text-align: center;
      line-height: 80px;
    }

    @media (max-width: 900px) {
      .main h1 {
        font-size: 40px;
        line-height: 60px;
      }
    }

    img {
      width: 100px;
      margin: 15px;
      border-radius: 50%;
      margin-left: 70px;
      border: 3px solid #000000;
    }

    .seachmenudatapart
    {
    display: flex;
    justify-content: flex-start;
    flex-direction: row;
    }

  </style>
  <link rel="stylesheet" href="../css/all.min.css">
  <script src="../js/jquery.min.js" charset="utf-8"></script>
</head>

<body>

    <div class="item">

    <div class="item itemmain">

      <div class="sub-menu">

        <input type="checkbox" class="sub-checkbox" value="Tables32">

    </div>
    <div class="item">
      <div class="seachmenudatapart">

  </div>

  $(document).ready(function() {
  // Toggle sub menus and update dropdown icon
  $('.sub-btn').click(function() {
    var subMenu = $(this).next('.sub-menu');
    subMenu.slideToggle();
    $(this).find('.dropdown').toggleClass('rotatebefore rotateafter');
  });

  // Check or uncheck checkboxes based on hierarchy
  $('.item').each(function() {
    var menuCheckbox = $(this).find('.menu-checkbox');
    var subCheckboxes = $(this).find('.sub-checkbox');
    var bigsubCheckboxes = $(this).find('.bigsub-checkbox');
    var childSubCheckboxes = $(this).find('.child-sub-checkbox');

    menuCheckbox.click(function() {
      var isChecked = menuCheckbox.is(':checked');
      subCheckboxes.prop('checked', isChecked);
      bigsubCheckboxes.prop('checked', isChecked);
      childSubCheckboxes.prop('checked', isChecked);
      updateMenuCheckboxAll();
    });

    subCheckboxes.click(function() {
      var isChecked = $(this).is(':checked');
      var parentCheckbox = $(this).closest('.itemmain').find('.menu-checkbox');
      var childCheckboxes = $(this).closest('.sub-menu').find('.child-sub-checkbox');
      parentCheckbox.prop('checked', isChecked);
      updateMenuCheckboxAll();
    });

    bigsubCheckboxes.click(function() {
      var isChecked = $(this).is(':checked');
      var parentCheckbox1 = $(this).closest('.itemmain').find('.menu-checkbox');
      var childCheckboxes = $(this).closest('.sub-menu').find('.child-sub-checkbox');
      parentCheckbox1.prop('checked', isChecked);
      childCheckboxes.prop('checked', isChecked);
      updateMenuCheckboxAll();
    });

    childSubCheckboxes.click(function() {
      var isChecked = $(this).is(':checked');
      var parentCheckbox = $(this).closest('.itemsub').find('.bigsub-checkbox');
      var grandparentCheckbox = $(this).closest('.itemmain').find('.menu-checkbox');
      parentCheckbox.prop('checked', isChecked);
      grandparentCheckbox.prop('checked', isChecked);
      updateMenuCheckboxAll();
    });
  });

  function updateMenuCheckboxAll() {
    var allCheckboxes = $('.menu-checkbox, .sub-checkbox, .bigsub-checkbox, .child-sub-checkbox');
    var checkedCheckboxes = allCheckboxes.filter(':checked');
    var menuCheckboxAll = $('.menu-checkboxall');
    menuCheckboxAll.prop('checked', allCheckboxes.length === checkedCheckboxes.length);
  }

  $('.menu-checkboxall').click(function() {
    var isChecked = $(this).is(':checked');
    $('.menu-checkbox, .sub-checkbox, .bigsub-checkbox, .child-sub-checkbox').prop('checked', isChecked);
  });
