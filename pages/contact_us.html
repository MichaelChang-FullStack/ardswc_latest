<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWCB</title>
    <link rel="stylesheet" type="text/css" href="../css/pages_contact_us.css">
    <link rel="stylesheet" type="text/css" href="../css/nav_bar_pages.css">
    <link href="../css/footer_bar_pagesv2.css" rel="stylesheet" />
    
    <script src='../js/jquery.min.js'></script>
    
<script src="../js/js_top/jquery.easing.1.3.js"></script>
<script src="../js/page_script_top_nav_bar.js"></script>
<script src="../js/pages_footer_bar.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>
  sessionStorage.removeItem("currentpage");
  sessionStorage.setItem("currentpage","contact_us");
</script>
      
</head>
<body>
    <div class="main_container">
      <div class="main_container_top_nav_bar" id="main_container_top_nav_bar"></div>
        

        <div class="main_container_part3">
        </div>

        <div class="main_container_part4">
          <div class="main_container_part4_child1">
            <div class="main_container_part4_child1_part1">
              <h6 class="text1">首頁</h6>
            </div>
            <div class="main_container_part4_child1_part1">
              <h6 class="text1">></h6>
            </div>
            <div class="main_container_part4_child1_part1">
              <h6 class="text2">聯絡我們</h6>
            </div>
          </div>
          <div class="main_container_part4_child2">
           
            
          </div>
          <div class="main_container_part4_child3">
           

          <div  class="main_container_part4_child3_1_new">
            <div class="main_container_part4_child3_1_new_1">
              <div class="main_container_part4_child3_1_new_1_child1">
              </div>
              <div class="main_container_part4_child3_1_new_1_child2">
                <img src="../asset/images/tree.png" alt="tree">
              </div>
            </div>
            <div class="main_container_part4_child3_1_new_2">
              <div class="main_container_part4_child3_1_new_2_child1">
                <h1 class="title_main">聯絡我們</h1>
              </div>
              <div class="main_container_part4_child3_1_new_2_child2">
                <hr class="green_strip_below_title">
              </div>
            </div>
          </div>


        
          <div class="main_container_part4_child3_2">
          <hr class="gray_strip_below_title">
          </div>

          </div>
          <div class="main_container_part4_child4">
            <form id="addnew_form_data" action="" method="POST" enctype="multipart/form-data">
              <input type="hidden" id="currentUrlInput" name="currentUrlInput">
            <div class="main_container_part4_child4_sub1">
              <div class="main_container_part4_child4_sub1_2">
                <label for="nickname" class="form_data_title">暱稱(必填)</label>
                <input class="form_data_input1" name="nickname" id="nickname" value="" required />                
              </div>
            </div>

            <div class="main_container_part4_child4_sub1">
              <div class="main_container_part4_child4_sub1_2">
                <label for="gender" class="form_data_title">性別</label>
                <div class="gender_checkbox">
                  <div class="gender_checkbox_form__group">
                    <input type="checkbox" id="male" value="男性" name="gender" onclick="uncheckOther('male')" checked>
                    <label for="male" class="gender_checkbox">男性</label>
                  </div>
                  <div class="gender_checkbox_form__group">
                    <input type="checkbox" id="female" value="女性" name="gender" onclick="uncheckOther('female')">
                    <label for="female" class="gender_checkbox">女性</label>
                  </div>
                </div>

              </div>
            </div>
            
            

            <div class="main_container_part4_child4_sub1">
              <div class="main_container_part4_child4_sub1_2">
                <label for="email" class="form_data_title">E-mail(必填)</label>
                <input class="form_data_input1" name="email" id="email" value="" required />                
              </div>
            </div>

            <div class="main_container_part4_child4_sub1">
              <div class="main_container_part4_child4_sub1_2">
                <label for="contact_number" class="form_data_title">聯絡電話</label>
                <input class="form_data_input1" name="contact_number" id="contact_number" value="" required />                
              </div>
            </div>

            <div class="main_container_part4_child4_sub1">
              <div class="main_container_part4_child4_sub1_2">
                <label for="feedback" class="form_data_title">意見回饋(必填)</label>
                <textarea class="form_data_textarea" name="feedback" id="feedback" value="" required>  </textarea>              
              </div>
            </div>

            <div class="main_container_part4_child4_sub1">
              <div class="main_container_part4_child4_sub1_2">
                <label for="verification_code" class="form_data_title">驗證碼(必填)</label>
                <div class="main_container_part4_child4_sub1_child1">
                  <div class="main_container_part4_child4_sub1_child1_1">
                    <input class="form_data_input2" name="verification_code" id="verification_code" value="" required />                
                  </div>
                  <div class="main_container_part4_child4_sub1_child1_2">
                    <div id="captcha">
                      <label id="captcha-label"></label>
                  </div>                
                  </div>
                  <div class="main_container_part4_child4_sub1_child1_3">
                    <!--<button id="speak">Speak</button>-->
                    <div id="speak" >
                        <img src="../asset/images/contact_us/icon_sound.svg" alt="icon_sound">
                    </div>
                    <audio id="audio"></audio>             
                  </div>
                  <div class="main_container_part4_child4_sub1_child1_4">
                    <!--<button id="captcha-regenerate"' onclick="regenerateCaptcha()"'>Regenerate</button> -->
                    <div id="captcha-regenerate"  onclick="regenerateCaptcha()">
                      <img src="../asset/images/contact_us/icon_regenerate_capcha.svg" alt="icon_regenerate_capcha">
                  </div>              
                  </div>
                </div>
                
              </div>
            </div>

            <div class="main_container_part4_child4_sub1">
              <hr  class="gray_strip_below_footer"/>
            </div>

            <div class="main_container_part4_child4_sub4">
              <div class="main_container_part4_child4_sub4_1" onclick="clear_form()">
                <button type="button" class="clear_btn">清除</button>               
              </div>
              <div class="main_container_part4_child4_sub4_1">
                <button type="submit" id="save-event" class="submit_btn">送出</button>               
              </div>
            </div>

            </form>

            


          </div>

        </div>

        <div class="footer_main" id="footer_main">
         
        </div>
    </div>
    
</body>
</html>
<script>
  // Get the current URL
  var currentUrl = window.location.href;
    
    // Assign it to the input value
    document.getElementById('currentUrlInput').value = currentUrl;

  function uncheckOther(currentId) {
    var checkboxes = document.querySelectorAll('input[name="gender"]');
    checkboxes.forEach(function(checkbox) {
      if (checkbox.id !== currentId) {
        checkbox.checked = false;
      }
    });
  }

  function clear_form()
  {
    const add_contact_us_form1 = document.getElementById("addnew_form_data");
    add_contact_us_form1.reset();
  }
</script>
<script src="../js/page_contact_us.js"></script>
