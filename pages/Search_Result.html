<script>
    function navigateToSearchResult() {
        const inputVlue = document.getElementById('search-result-input').value;
        if (!inputVlue) {
            alert('請輸入關鍵字');
            return;
        } else {
            window.location.href = "/swcb-new/pages/Search_Result.html?searchText=" + inputVlue;
        }
    }
    function setBottom(bgNumber, bottomNumber){
        $(`#footer-bg-${bgNumber}`).css({
            "bottom": `${bottomNumber}px`
        })
    }
    $(document).ready(function () {
        var footerHideBtn = document.getElementById("footer_hide_btn");
        var styles = window.getComputedStyle(footerHideBtn);
        $("#footershowBtn").click(function() {
            var width = document.documentElement.clientWidth;
            if(width > 768) {
                if(styles.display === 'none') {
                    setBottom(5, 300);
                    setBottom(6, 280);
                } else {
                    setBottom(5, 800);
                    setBottom(6, 780);
                }
            } 
            else if(width > 436) {
                if(styles.display === 'none') {
                    setBottom(5, 470);
                } else {
                    setBottom(5, 1028);
                }
            }
            else if(width < 435){
                if(styles.display === 'none') {
                    setBottom(5, 643);
                } else {
                    setBottom(5, 1265);
                }
            }
        });

    })
</script>
