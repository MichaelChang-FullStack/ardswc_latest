<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARDSWC</title>
<link rel="icon" href="../asset/images/swcb_logo_new.png" type="image/png">
  <link rel="stylesheet" type="text/css" href="../css/nav_bar_pages.css">
  <link rel="stylesheet" type="text/css" href="../css/Cool_School_Family.css">
  <link href="../css/footer_bar_pages.css" rel="stylesheet" />

  <script src='../js/jquery.min.js'></script>

  <script src="../js/js_top/jquery.easing.1.3.js"></script>
  <script src="../js/page_script_top_nav_bar.js"></script>
  <script src="../js/pages_footer_bar.js"></script>
  <script>
    sessionStorage.removeItem("currentpage");
    sessionStorage.setItem("currentpage", "Classroom_Application_Results");
  </script>

</head>

<body>
  <div class="main_container">
    <div class="main_container_top_nav_bar" id="main_container_top_nav_bar"></div>

    <div class="main_container_part4">
      <div class="main_container_part4_child1">
        <div class="main_container_part4_child1_part1">
          <a href="/" name="回到首頁" style="text-decoration: none;">
            <h6 class="text1">首頁</h6>
          </a>
        </div>
        <div class="main_container_part4_child1_part1">
          <h6 class="text1">></h6>
        </div>
        <div class="main_container_part4_child1_part1">
          <h6 class="text1">酷學校</h6>
        </div>
        <div class="main_container_part4_child1_part1">
          <h6 class="text1">></h6>
        </div>
        <div class="main_container_part4_child1_part1">
          <h6 class="text2">家族查詢</h6>
        </div>
      </div>
      <div class="main_container_part4_child3">


        <div class="main_container_part4_child3_1_new">
          <div class="main_container_part4_child3_1_new_1">
            <div class="main_container_part4_child3_1_new_1_child1">
            </div>
            <div class="main_container_part4_child3_1_new_1_child2">
              <img loading="lazy" src="../asset/images/tree.png" alt="tree">
            </div>
          </div>
          <div class="main_container_part4_child3_1_new_2">
            <div class="main_container_part4_child3_1_new_2_child1">
              <h1 class="title_main">家族查詢</h1>
            </div>
            <div class="main_container_part4_child3_1_new_2_child2">
              <hr class="green_strip_below_title">
            </div>
          </div>
        </div>



        <div class="main_container_part4_child3_2">
          <hr class="gray_strip_below_title">
        </div>

      </div>
      <div class="main_container_part4_child4">



        <div class="main_container_part4_child4_1">
          <div class="search-container valid">
            <label id="main-input-label" for="main-input" class="sr-only">關鍵字搜尋：</label>
            <input type="text" class="input_search" id="class_input_search" aria-labelledby="main-input-label" placeholder="輸入關鍵字..." required>
            <div id="main-input-description" class="sr-only">請在此輸入您想搜尋的關鍵字。</div>
            <div class="search-img" tabindex="1" onclick="expandContainer()">
              <div class="search-img_part1">
                <img loading="lazy" src="../asset/images/icon_search.svg" alt="Search" class="search-icon">
              </div>
              <div class="search-img_part2">
                <span class="search_text">搜尋</span>
              </div>
            </div>
          </div>
        </div>

        <div class="main_container_part4_child4_strip">
          <hr class="gray_strip_below_title">
        </div>

        <div class="Drop_down_container">
          <div class="drop_down drop_down_1">
            <h5>縣市:</h5>
            <div class="select-block">
              <select>
                <option value="selectCity" disabled="" selected="">請選擇縣市</option>
                <option value="all">全部</option>
                <option value="基隆市">基隆市</option>
                <option value="臺北市">臺北市</option>
                <option value="新北市">新北市</option>
                <option value="桃園市">桃園市</option>
                <option value="新竹市">新竹市</option>
                <option value="新竹縣">新竹縣</option>
                <option value="苗栗縣">苗栗縣</option>
                <option value="臺中市">臺中市</option>
                <option value="南投縣">南投縣</option>
                <option value="彰化縣">彰化縣</option>
                <option value="雲林縣">雲林縣</option>
                <option value="嘉義縣">嘉義縣</option>
                <option value="嘉義市">嘉義市</option>
                <option value="臺南市">臺南市</option>
                <option value="高雄市">高雄市</option>
                <option value="屏東縣">屏東縣</option>
                <option value="宜蘭縣">宜蘭縣</option>
                <option value="花蓮縣">花蓮縣</option>
                <option value="臺東縣">臺東縣</option>
                <option value="澎湖縣">澎湖縣</option>
                <option value="金門縣">金門縣</option>
                <option value="連江縣">連江縣</option>
              </select>
            </div>
          </div>
          <div class="drop_down drop_down_2">
            <h5>屆別:</h5>
            <div class="select-block">
              <select>
                <option value="selectSession" disabled="" selected="">請選擇屆別</option>
                <option value="all">全部</option>
                <option value="第一屆">第一屆</option>
                <option value="第二屆">第二屆</option>
                <option value="第三屆">第三屆</option>
                <option value="第四屆">第四屆</option>
                <option value="第五屆">第五屆</option>
                <option value="第六屆">第六屆</option>
                <option value="第七屆">第七屆</option>
              </select>
            </div>
          </div>
          <div class="drop_down drop_down_3">
            <h5>學校屬性:</h5>
            <div class="select-block">
              <select>
                <option value="selectAttribute" disabled="" selected="">請選擇學校屬性</option>
                <option value="all">全部</option>
                <option value="一般">一般</option>
                <option value="坡地">坡地</option>
                <option value="潛勢學校">潛勢學校</option>
                <option value="離島">離島</option>
              </select>
            </div>
          </div>
          <div class="drop_down drop_down_4">
            <h5>示範基地:</h5>
            <div class="select-block">
              <select>
                <option value="selectBaseType" disabled="" selected="">請選擇年度</option>
                <option value="all">全部</option>
                <option value="107年推廣示範基地">107年
                </option>
                <option value="108年推廣示範基地">108年
                </option>
                <option value="109年推廣示範基地">109年
                </option>
                <option value="110年推廣示範基地">110年
                </option>
                <option value="111年推廣示範基地">111年
                </option>

              </select>
            </div>
          </div>
        </div>

        <div class="main_container_part3">
          <table border="1">
            <thead>
              <tr>
                <th>序號</th>
                <th>學校名稱</th>
                <th>屆別</th>
                <th>學校屬性</th>
                <th>示範基地</th>
              </tr>
            </thead>
            <tbody id="cool-school-family">

            </tbody>
          </table>
        </div>



      </div>

    </div>

    <div class="footer_main" id="footer_main">

    </div>
  </div>

</body>
<script src="../js/coolSchoolFamily.js"></script>

</html>
