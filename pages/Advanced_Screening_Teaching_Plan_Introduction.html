  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data("ResourceDatas", () => ({
        info: {},
        showModal: false,
        sending: false,
        usage: '請選擇',
        init() {
        },
        loadTitle() {
          $('.feedback-form .title input').val($('h1').text());
        },
        submit(e) {
          e.preventDefault();
          const apiUrl = '/server/routes.php?action=member_lease';

          const requestBody = Object.fromEntries(new FormData(e.target).entries());

          if (!this.sending) {
            this.sending = true;
            this.myFetch(apiUrl, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(requestBody),
            }, data => {
              this.sending = false;
              if ('done!' === data) {
                location.reload();
              }
            });
          }
        },
        openRentalModal() {
          if (localStorage.getItem('MNo')) {
            this.info = JSON.parse($('#resource-info').attr('data-info'));
            this.showModal = true;
          } else {
            alert('請登入以進行租借申請');
          }
        },
        closeModal() {
          this.showModal = false;
        },
        myFetch(apiUrl, options, resolve) {
          fetch(apiUrl, options)
            .then((res) => {
              const contentType = res.headers.get("content-type");
              if (!contentType || !contentType.includes("application/json")) {
                console.log("非 JSON 格式資料");
                res = res.text();
              } else {
                res = res.json();
              }
              return res;
            })
            .then(resolve)
            .catch((e) => console.log(e));
        },
      }));
    });

  </script>

                              <div @click="usage = $el.innerText; active = !active">課堂教學</div>
                              <div @click="usage = $el.innerText; active = !active">自主學習</div>
                              <div @click="usage = $el.innerText; active = !active">推廣應用</div>
                              <div @click="usage = $el.innerText; active = !active">活動競賽</div>
                            </div>
                          </div>
                        </div>
                      </div>

                      <p class="notice">※登記完成後，請至【會員專區>教具租借紀錄】快速查看租借紀錄。</p>
                      <div class="footer">
                        <input type="hidden" name="MNo" :value="localStorage.getItem('MNo')" />
                        <input type="hidden" name="bookId"
                          :value="new URLSearchParams(location.search).get('bookId')" />
                        <input class="submit" type="submit" :disabled="usage === '請選擇'" value="登記"></button>
                      </div>
                    </form>
                  </div>

                  <div class="bg-cover" @click="showModal = false"></div>
                </div>
              </template>

              <div class="favorite" x-data="{
                favData: {
                  active: false,
                  count: 0,
                  apiUrl: '/server/routes.php?action=favorite',
                  MNo: null,
                  bookId: null,
                },
                fetch(apiUrl, options, resolve){
                  fetch(apiUrl, options).then(res => {
                    const contentType = res.headers.get('content-type');
                    if(!contentType || !contentType.includes('application/json')){
                      console.log('非 JSON 格式資料');
                      res = res.text();
                    }else{
                      res = res.json();
                    }
                    return res;
                  })
                  .then(resolve)
                  .catch(e => console.log(e));
                },
                favor(e){
                  const apiUrl = this.favData.apiUrl;
                  const requestBody = {
                    bookId: this.favData.bookId,
                    MNo: this.favData.MNo,
                  };
  
                  const favIcon = e.currentTarget;
  
                  if(favIcon.classList.contains('active')){
                    requestBody.VM_METHOD = 'delete';
                  }
  
                  this.fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody),
                  }, data => {
                    if('done!' === data){
                      favIcon.classList.toggle('active');
                      this.getFavData();
                    }
                  });
                },
                init(){
                  this.favData.MNo = localStorage.getItem('MNo');
                  this.favData.bookId = new URLSearchParams(location.search).get('bookId');
  
                  this.getFavData();
                },
                getFavData(){
                  this.fetch(`${this.favData.apiUrl}&MNo=${this.favData.MNo}&bookId=${this.favData.bookId}`, {
                    method: 'GET',
                    headers: {
                      'Content-Type': 'application/json',
                    },
                  }, data => {
                    this.favData.active = data.favorites.split(',').includes(this.favData.bookId);
                    this.favData.count = data.count;
                  });
                }
              }">
                <div @click="favor" class="fav-icon" :class="favData.active ? 'active' : ''">
                  <svg width="35" height="30" viewBox="0 0 35 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                      d="M16.4151 5.01421L17.2727 6.44473L18.1304 5.01421C19.6072 2.55095 22.1946 1 25.124 1C29.6982 1 33.5455 4.99531 33.5455 10C33.5455 12.2165 32.5839 14.5173 31.0239 16.7753C29.4697 19.0248 27.3777 21.1502 25.2534 22.995C23.1335 24.8359 21.0089 26.3738 19.4119 27.4526C18.6143 27.9913 17.9506 28.4139 17.4878 28.701C17.4111 28.7485 17.34 28.7924 17.2747 28.8324C17.2091 28.7919 17.1375 28.7475 17.0604 28.6993C16.5975 28.4101 15.9336 27.9844 15.1359 27.4424C13.5385 26.357 11.4134 24.8111 9.29309 22.9646C7.16832 21.1143 5.07574 18.9858 3.52115 16.7395C1.9602 14.484 1 12.1941 1 10C1 4.99531 4.84726 1 9.42149 1C12.3509 1 14.9382 2.55095 16.4151 5.01421Z"
                      stroke="#467D1E" stroke-width="2" />
                  </svg>
                </div>
                <div class="value" x-text="favData.count">0</div>
              </div>
            </div>

            <div class="feedback-form">
              <input type="checkbox" id="layer-hidden" class="hidden" aria-label="layer-hidden" />
              <div class="form">
                <h2>回饋表單</h2>
                <form x-data="{
                  sending: false,
                  send(){
                    const entries = Object.fromEntries(new FormData($root).entries());
  
                    const valid = entries.practical_level.length + entries.push_level.length + entries.steer.length;
                    
                    if(valid > 0){
                      if(!this.sending){
                        this.sending = true;
                        entries.id = new URLSearchParams(window.location.search).get('bookId');
    
                        const apiUrl = '/server/routes.php?action=feedback';
                        const requestBody = JSON.stringify(entries);
    
                        fetch(apiUrl, {
                          method: 'POST',
                          headers: {
                            'Content-Type': 'application/json',
                          },
                          body: requestBody,
                        }).then(res => {
                          const contentType = res.headers.get('content-type');
                          if(!contentType || !contentType.includes('application/json')){
                            console.log('非 JSON 格式資料');
                            res = res.text();
                          }else{
                            res = res.json();
                          }
                          return res;
                        })
                        .then(data => {
                          $root.closest('.feedback-form').classList.add('sent');
                          this.sending = false;
                        })
                        .catch(e => console.log(e));
                      }else{
                        
                      }
                    }
                  }
                }">
                  <div class="title">
                    <label>教具名稱</label>
                    <input type="text" name="name" readonly aria-label="教具名稱" />
                  </div>
                  <div class="select-group">
                    <div>
                      <label>使用情境</label>
                      <div x-data="{active: false, value: '課堂教學', 
                      changeSelect(e){ 
                        this.value = e.currentTarget.innerText; 
                        this.active = !this.active;
                        if('自主學習' == this.value){
                          document.querySelector('.grade').style = `opacity: 0.5; pointer-events: none;`;
                        }else{
                          document.querySelector('.grade').style = ``;
                        }
                      } 
                    }" class="dropdown-wrap" :class="active && 'active'" @click.outside="active=false">
                        <input class="text-box" @click="active = !active" type="text" name="context" :value="value"
                          readonly aria-label="使用情境">
                        <div class="options">
                          <div @click="changeSelect">課堂教學</div>
                          <div @click="changeSelect">自主學習</div>
                          <div @click="changeSelect">推廣應用</div>
                          <div @click="changeSelect">活動競賽</div>
                        </div>
                      </div>
                    </div>
                    <div class="grade">
                      <label>使用年級</label>
                      <div x-data="{active: false, value: '國小低年級'}" class="dropdown-wrap" :class="active && 'active'"
                        @click.outside="active=false">
                        <input class="text-box" @click="active = !active" type="text" name="grade" :value="value"
                          readonly aria-label="使用年級">
                        <div class="options">
                          <div @click="value = $el.innerText; active = !active">國小低年級</div>
                          <div @click="value = $el.innerText; active = !active">國小中年級</div>
                          <div @click="value = $el.innerText; active = !active">國小高年級</div>
                          <div @click="value = $el.innerText; active = !active">國中</div>
                          <div @click="value = $el.innerText; active = !active">高中</div>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="mb-0">
                    <label>實用度</label>
                    <input name="practical_level" class="rating" type="number" aria-label="實用度">
                  </div>
                  <div class="mb-0">
                    <label>推薦度</label>
                    <input name="push_level" class="rating" type="number" aria-label="推薦度">
                  </div>
                  <div>
                    <label for="comments">回饋建議</label>
                    <textarea id="comments" name="steer" rows="5"></textarea>
                  </div>
                  <div class="hr"></div>
                  <div class="btn mb-0">
                    <label x-data @click="document.querySelector('#layer-hidden').toggleAttribute('checked')" class="mb-0 cancel button">取消</label>
                    <button class="submit button" type="button" @click="send" :class="sending ? 'waiting' : ''">送出</button>
                  </div>
                </form>
              </div>

              <div class="done">
                <svg width="132" height="132" viewBox="0 0 132 132" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="66.0008" cy="65.6766" r="65.6766" fill="#558C2D" />
                  <path d="M41.9395 68.6617L55.83 84.2076C56.2304 84.6557 56.9326 84.652 57.3283 84.1998L90.7532 46"
                    stroke="white" stroke-width="11" stroke-linecap="round" />
                </svg>
                <p>感謝您的寶貴意見，已收到您的回饋。</p>
                <label x-data @click="document.querySelector('#layer-hidden').toggleAttribute('checked')" class="button">確定</label>
              </div>

              <label class="layer" x-data @click="document.querySelector('#layer-hidden').toggleAttribute('checked')" aria-label="關閉"></label>
            </div>
          </div>
        </div>

      </div>


      <div class="main_container_part4_child3_subchild5" style="cursor: pointer;">
        <div class="informationcontainer">
          <div class="informationinformationtabs">
            <div class="informationtab information_detail_content1-informationtab active"
              data-target="information_detail_content1-info">
              <h4 class="information_title">簡介</h4>
            </div>
            <div class="informationtab information_detail_content2-informationtab"
              data-target="information_detail_content2-info">
              <h4 class="information_title">教學目標</h4>
            </div>
            <div class="informationtab information_detail_content3-informationtab"
              data-target="information_detail_content3-info">
              <h4 class="information_title">教學資源</h4>
            </div>
            <div class="informationgreen-line"></div>
            <div class="informationblack-line"></div>
          </div>

          <div class="information_detail_content1-info active-info" id="resource-description">
            <h5></h5>
          </div>

          <div class="information_detail_content2-info" id="resource-purpose">

          </div>

          <div class="information_detail_content3-info">
            <div class="referrence_download_main" id="resource-download-list">

            </div>
          </div>
        </div>
      </div>

      <div class="main_container_part4_child3_subchild6">
        <div class="main_container_part4_child3_subchild6_part1">

          <div class="informationinformationtabs1">
            <div class="informationtab1 active">
              <h4 class="informationcontentslider_title">推薦相同類型</h4>
            </div>
            <div class="informationgreen-line1"></div>
            <div class="informationblack-line1"></div>
          </div>

        </div>
        <div class="main_container_part4_child3_subchild6_part2">
          <div class="card-slider" id="same-resource">
          </div>

        </div>

      </div>

    </div>

  </div>
