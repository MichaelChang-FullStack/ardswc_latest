<script>
    function setBottom(bgNumber, bottomNumber) {
        $(`#footer-bg-${bgNumber}`).css({
            "bottom": `${bottomNumber}px`
        })
    }
    $(document).ready(function () {
        var footerHideBtn = document.getElementById("footer_hide_btn");
        var styles = window.getComputedStyle(footerHideBtn);
        $("#footershowBtn").click(function () {
            var width = document.documentElement.clientWidth;
            if (width > 768) {
                if (styles.display === 'none') {
                    setBottom(5, 300);
                    setBottom(6, 280);
                } else {
                    setBottom(5, 800);
                    setBottom(6, 780);
                }
            }
            else if (width > 436) {
                if (styles.display === 'none') {
                    setBottom(5, 470);
                } else {
                    setBottom(5, 1028);
                }
            }
            else if (width < 435) {
                if (styles.display === 'none') {
                    setBottom(5, 643);
                } else {
                    setBottom(5, 1265);
                }
            }
        });

        const urlParams = new URLSearchParams(location.search);
        switch (urlParams.get('fn')) {
            case 'daily_picbook':
                if (urlParams.get('filterId') == '11,12') {
                    const fnValue = {
                        name: 'picbook',
                        time: new Date().getTime(),
                    };

                    daily_event(fnValue);
                    break;
                }
            case 'daily_push':
                if (urlParams.has('isPush')) {
                    const fnValue = {
                        name: 'push',
                        time: new Date().getTime(),
                    };

                    daily_event(fnValue);
                    break;
                }
            case 'daily_video':
                if (urlParams.get('filterId') == '24') {
                    const fnValue = {
                        name: 'video',
                        time: new Date().getTime(),
                    };

                    daily_event(fnValue);
                    break;
                }
            case 'daily_game':
                if (urlParams.get('filterId') == '14') {
                    const fnValue = {
                        name: 'game',
                        time: new Date().getTime(),
                    };

                    daily_event(fnValue);
                    break;
                }
            case 'daily_plan':
                if (urlParams.get('filterId') == '4,17,18,19,20') {
                    const fnValue = {
                        name: 'plan',
                        time: new Date().getTime(),
                    };

                    daily_event(fnValue);
                    break;
                }
            default:
                localStorage.setItem('dailyFn', '');
        }

        function daily_event(fnValue) {
            localStorage.setItem('dailyFn', JSON.stringify(fnValue));

            $('#search-content').on('click', '.result-link', e => {
                const bookId = new URLSearchParams(e.currentTarget.getAttribute('href').split('?')[1]).get('bookId');
                fnValue.bookId = bookId;
                localStorage.setItem('dailyFn', JSON.stringify(fnValue));
            });
        }
    })
</script>
