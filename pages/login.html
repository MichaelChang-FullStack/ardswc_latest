<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登入</title>
  <link rel="icon" href="../asset/images/swcb_logo_new.png" type="image/png">
  <link rel="stylesheet" type="text/css" href="../css/nav_bar_pages.css">
  <link href="../css/footer_bar_pages.css" rel="stylesheet" />
  <link rel="stylesheet" type="text/css" href="../css/login.css" />
  <link rel="stylesheet" type="text/css" href="../css/theme.css">
  <script src='../js/jquery.min.js'></script>
  <script src="../js/page_script_top_nav_bar.js"></script>
  <script src="../js/pages_footer_bar.js"></script>
</head>

<body>
  <div class="main_container">
    <div class="main_container_top_nav_bar" id="main_container_top_nav_bar"></div>
  </div>
  <div class="login-container">
    <div class="login-panel">
      <div class="image-section">
        <div class="login-bg-2-container">
          <img loading="lazy" src="../asset/images/login/login-bg-2.png" alt="tree">
        </div>
        <div class="login-bg-1-container">
          <img loading="lazy" src="../asset/images/login/login-bg-1.png" alt="tree">
        </div>
      </div>
      <div class="login-section">
        <h3>會員登入</h3>
        <button id="facebook-jssdk" class="login-btn facebook-btn" onclick="facebookLogin();">
          <span><img loading="lazy" src="../asset/images/login/facebook_logo.png" alt="Facebook Logo" /></span>
          <span>使用Facebook帳戶登入</span>
          <span></span>
        </button>

        <button class="login-btn google-btn">
          <span>
            <img loading="lazy" src="../asset/images/login/google_logo.png" />
          </span><span>使用Google帳戶登入</span><span></span>
        </button>
      </div>
    </div>
  </div>
  <div class="footer_main" id="footer_main"></div>
</body>
<script>

function facebookLogin() {
  FB.login(function (response) {
    if (response.status === 'connected') {
      // 连接成功，使用访问令牌调用Graph API获取用户信息
      FB.api('/me', { fields: 'name,picture' }, function (userData) {
        if (userData && !userData.error) {
          // userData包含用户的姓名和头像信息
          console.log('User name:', userData.name);
          console.log('User picture:', userData.picture.data.url);
        }
      });
    } else {
      console.log('Failed to log in with Facebook');
    }
  }, { scope: 'public_profile,email' }); // 请求用户授权的权限
}
  (function (d, s, id) {
    var js, fjs = d.getElementsByTagName(s)[0];
    if (d.getElementById(id)) { return; }
    js = d.createElement(s); js.id = id;
    js.src = "https://connect.facebook.net/en_US/sdk.js";
    fjs.parentNode.insertBefore(js, fjs);
  }(document, 'script', 'facebook-jssdk')
  );


  window.fbAsyncInit = function () {
    FB.init({
      appId: '809375527735875',
      xfbml: true,
      version: 'v19.0'
    });
  };

</script>
<script async defer crossorigin="anonymous"
  src="https://connect.facebook.net/zh_TW/sdk.js#xfbml=1&version=v19.0&appId=809375527735875" nonce="5zr2lBgF"></script>
<script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
</html>
