<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登入</title>
  <link rel="icon" href="../asset/images/swcb_logo_new.png" type="image/png">
  <link rel="stylesheet" type="text/css" href="../css/nav_bar_pages.css">
  <link href="../css/footer_bar_pages.css" rel="stylesheet" />
  <link rel="stylesheet" type="text/css" href="../css/login.css" />
  <link rel="stylesheet" type="text/css" href="../css/theme.css">
  <script src='../js/jquery.min.js'></script>
  <script src="../js/page_script_top_nav_bar.js"></script>
  <script src="../js/pages_footer_bar.js"></script>

</head>

<body>
  <div class="main_container">
    <div class="main_container_top_nav_bar" id="main_container_top_nav_bar"></div>
  </div>
  <div class="login-container">
    <div class="login-panel">
      <div class="image-section">
        <div class="login-bg-2-container">
          <img loading="lazy" src="../asset/images/login/login-bg-2.png" alt="tree">
        </div>
        <div class="login-bg-1-container">
          <img loading="lazy" src="../asset/images/login/login-bg-1.png" alt="tree">
        </div>
      </div>
      <div class="login-section">
        <h3>會員登入</h3>

        <p id="profile"></p>
        <p id="status"></p>

        <button id="facebook-jssdk" class="login-btn facebook-btn" onclick="facebookLogin();">
          <span><img loading="lazy" src="../asset/images/login/facebook_logo.png" alt="Facebook Logo" /></span>
          <span>使用Facebook帳戶登入</span>
          <span></span>
        </button>

        <button class="login-btn google-btn" id="authorize_button" onclick="handleAuthClick()">
          <span>
            <img loading="lazy" src="../asset/images/login/google_logo.png" />
          </span><span>使用Google帳戶登入</span><span></span>
        </button>

        <button class="login-btn google-btn" id="signout_button" onclick="handleSignoutClick()">
          <span>
            <img loading="lazy" src="../asset/images/login/google_logo.png" />
          </span><span>使用Google帳戶登出</span><span></span>
        </button>
        <pre id="content" style="white-space: pre-wrap;"></pre>
        <!--Add buttons to initiate auth sequence and sign out-->
        <!-- <button id="authorize_button" onclick="handleAuthClick()">Authorize</button>
        <button id="signout_button" onclick="handleSignoutClick()">Sign Out</button> -->

      </div>
    </div>
  </div>
  <div class="footer_main" id="footer_main"></div>

  <script type="text/javascript">
    /* exported gapiLoaded */
    /* exported gisLoaded */
    /* exported handleAuthClick */
    /* exported handleSignoutClick */

    // TODO(developer): Set to client ID and API key from the Developer Console
    const CLIENT_ID = '240964062192-m0goorq08i3oih9njl5bef6fu3jsfob8.apps.googleusercontent.com';
    const API_KEY = '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';

    // Discovery doc URL for APIs used by the quickstart
    const DISCOVERY_DOC = 'https://script.googleapis.com/$discovery/rest?version=v1';

    // Authorization scopes required by the API; multiple scopes can be
    // included, separated by spaces.
    const SCOPES = 'https://www.googleapis.com/auth/script.projects';

    let tokenClient;
    let gapiInited = false;
    let gisInited = false;

    document.getElementById('authorize_button').style.visibility = 'hidden';
    document.getElementById('signout_button').style.visibility = 'hidden';

    /**
     * Callback after api.js is loaded.
     */
    function gapiLoaded() {
      gapi.load('client', initializeGapiClient);
    }

    /**
     * Callback after the API client is loaded. Loads the
     * discovery doc to initialize the API.
     */
    async function initializeGapiClient() {
      await gapi.client.init({
        apiKey: API_KEY,
        // discoveryDocs: [DISCOVERY_DOC],
      });
      gapiInited = true;
      maybeEnableButtons();
    }

    /**
     * Callback after Google Identity Services are loaded.
     */
    function gisLoaded() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: '', // defined later
      });
      gisInited = true;
      maybeEnableButtons();
    }

    /**
     * Enables user interaction after all libraries are loaded.
     */
    function maybeEnableButtons() {
      if (gapiInited && gisInited) {
        document.getElementById('authorize_button').style.visibility = 'visible';
      }
    }

    /**
     *  Sign in the user upon button click.
     */
    function handleAuthClick() {
      tokenClient.callback = async (resp) => {
        if (resp.error !== undefined) {
          throw (resp);
        }
        document.getElementById('signout_button').style.visibility = 'visible';
        document.getElementById('authorize_button').innerText = 'Refresh';
        await createScript();
      };

      if (gapi.client.getToken() === null) {
        // Prompt the user to select a Google Account and ask for consent to share their data
        // when establishing a new session.
        tokenClient.requestAccessToken({ prompt: 'consent' });
      } else {
        // Skip display of account chooser and consent dialog for an existing session.
        tokenClient.requestAccessToken({ prompt: '' });
      }
    }

    /**
     *  Sign out the user upon button click.
     */
    function handleSignoutClick() {
      const token = gapi.client.getToken();
      if (token !== null) {
        google.accounts.oauth2.revoke(token.access_token);
        gapi.client.setToken('');
        document.getElementById('content').innerText = '';
        document.getElementById('authorize_button').innerText = 'Authorize';
        document.getElementById('signout_button').style.visibility = 'hidden';
      }
    }

    /**
     * Creates a new 'Hello world' script.
     */
    async function createScript() {
      let response;
      try {
        const createRequest = {
          resource: {
            title: 'My Script',
          },
        };
        response = await gapi.client.script.projects.create(createRequest);

        const updateContentRequest = {
          scriptId: response.result.scriptId,
          resource: {
            files: [{
              name: 'hello',
              type: 'SERVER_JS',
              source: 'function helloWorld() {\n  console.log("Hello, world!");\n}',
            }, {
              name: 'appsscript',
              type: 'JSON',
              source: '{"timeZone":"America/New_York","' +
                'exceptionLogging":"CLOUD"}',
            }],
          },
        };
        response = await gapi.client.script.projects.updateContent(updateContentRequest);
        const output = `Script URL: https://script.google.com/d/${response.result.scriptId}/edit`;
        document.getElementById('content').innerText = output;
      } catch (err) {
        document.getElementById('content').innerText = err.message;
        return;
      }
    }
  </script>
  <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
  <script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>

  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/zh_TW/sdk.js"></script>
  <script>
    window.fbAsyncInit = function () {
      FB.init({
        appId: '422390100774031',
        cookie: true,
        xfbml: true,
        version: 'v20.0'
      });

      FB.AppEvents.logPageView();

      // 在這裡檢查登錄狀態
      FB.getLoginStatus(function (response) {
        console.log('FB初始化完成，登錄狀態：', response.status);
      });
    };


  </script>
  <script>
    function facebookLogin() {
      if (typeof FB !== 'undefined') {
        FB.login(function (response) {
          if (response.authResponse) {
            var accessToken = response.authResponse.accessToken;

            if (response.status === 'connected') {
              FB.api('/me', {
                fields: 'id,name,email',
                // access_token: accessToken  
              }, function (userData) {
                if (userData && !userData.error) {
                  console.log('完整用戶資料:', userData);
                  document.getElementById('status').innerHTML = '感謝登入，' + userData.name + '!';
                } else {
                  console.error('獲取用戶資料時發生錯誤:', userData ? userData.error : '未知錯誤');
                  document.getElementById('status').innerHTML = '無法獲取用戶資訊';
                }
              });
            } else {
              console.log('Facebook 登入失敗');
              document.getElementById('status').innerHTML = 'Facebook 登入失敗';
            }
          }

        }, { scope: 'public_profile,email' });
      } else {
        console.error('Facebook SDK 尚未加載完成');
        document.getElementById('status').innerHTML = 'Facebook SDK 尚未準備就緒，請稍後再試';
      }
    }
  </script>
</body>

</html>
