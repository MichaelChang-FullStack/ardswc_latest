<!DOCTYPE html>
<html lang="en">
  <head>

    <link rel="stylesheet" type="text/css" href="../css/nav_bar_pages.css" />
    <link rel="stylesheet" type="text/css" href="../css/footer_bar_pages.css" />
    <link rel="stylesheet" type="text/css" href="../css/theme.css" />

  <script>
    sessionStorage.removeItem("currentpage");
    sessionStorage.setItem("currentpage", "loginpage");
  </script>

  <body>
    <div class="main_container">
      <div
        class="main_container_top_nav_bar"
        id="main_container_top_nav_bar"
      ></div>

      <div class="login-container">
        <div class="login-panel">
          <div class="image-section">
            <div class="login-bg-2-container">
              <img
                loading="lazy"
                src="../asset/images/login/login-bg-2.png"
                alt="tree"
              />
            </div>
            <div class="login-bg-1-container">
              <img
                loading="lazy"
                src="../asset/images/login/login-bg-1.png"
                alt="tree"
              />
            </div>
          </div>
          <div class="login-section">
            <h3>會員登入</h3>

            <p id="profile"></p>
            <p id="status"></p>

            <button
              id="facebook-jssdk"
              class="login-btn facebook-btn"
              onclick="facebookLogin();"
            >
              <span
                ><img
                  loading="lazy"
                  src="../asset/images/login/facebook_logo.png"
                  alt="Facebook Logo"
              /></span>
              <span>使用Facebook帳戶登入</span>
              <span></span>
            </button>

            <button
              class="login-btn google-btn"
              id="authorize_button"
              onclick="handleAuthClick()"
            >
              <span>
                <img
                  loading="lazy"
                  src="../asset/images/login/google_logo.png"
                /> </span
              ><span>使用Google帳戶登入</span><span></span>
            </button>

            <button
              class="login-btn google-btn"
              id="signout_button"
              onclick="handleSignoutClick()"
            >
              <span>
                <img
                  loading="lazy"
                  src="../asset/images/login/google_logo.png"
                /> </span
              ><span>使用Google帳戶登出</span><span></span>
            </button>
            <!-- <hr class="separator" />
            <div class="v8747_66132" onclick="redirectToBackend()">
              <span class="v8747_66133">後台權限登入</span>
            </div> -->
            <pre id="content" style="white-space: pre-wrap"></pre>
          </div>
        </div>
      </div>

      <div class="footer_main" id="footer_main"></div>
    </div>

    <script type="text/javascript">
      const CLIENT_ID =
        "21293225703-jp231iscj743s6ril945n0ad8ql5qb9o.apps.googleusercontent.com";
      const API_KEY = "AIzaSyBm7vO5EBLe9rT-4RmEHhb3f5-ExfU13Mc";

      const DISCOVERY_DOC =
        "https://script.googleapis.com/$discovery/rest?version=v1";

      const SCOPES =
        "https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email";

      let tokenClient;
      let gapiInited = false;
      let gisInited = false;

      document.getElementById("authorize_button").style.visibility = "block";
      document.getElementById("signout_button").style.visibility = "hidden";

      /**
       * Callback after api.js is loaded.
       */
      function gapiLoaded() {
        gapi.load("client", initializeGapiClient);
      }

      /**
       * Callback after the API client is loaded. Loads the
       * discovery doc to initialize the API.
       */
      async function initializeGapiClient() {
        try {
          await gapi.client.init({
            apiKey: API_KEY,
            discoveryDocs: [DISCOVERY_DOC],
          });

          gapiInited = true;
        } catch (err) {
          console.error("Error initializing GAPI client:", err);
          document.getElementById(
            "content"
          ).innerText = `Error initializing GAPI client: ${err.message}`;
        }
      }

      /**
       * Callback after Google Identity Services are loaded.
       */
      function gisLoaded() {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPES,
          callback: async (resp) => {
            if (resp.error !== undefined) {
              throw resp;
            }
            await getUserInfo();
          },
        });
        gisInited = true;
      }

      /**
       *  Sign in the user upon button click.
       */
      function handleAuthClick() {
        const token = gapi.client.getToken();
        if (token === null) {
          // 顯示授權畫面
          tokenClient.requestAccessToken({ prompt: "" });
        } else {
          // 跳過授權畫面，直接使用令牌
          tokenClient.requestAccessToken({ prompt: "" });
        }
      }

      /**
       *  Sign out the user upon button click.
       */
      function handleSignoutClick() {
        const token = gapi.client.getToken();
        if (token !== null) {
          google.accounts.oauth2.revoke(token.access_token);
          gapi.client.setToken("");
          document.getElementById("content").innerText = "";
          document.getElementById("authorize_button").style.display = "block";
        }
      }

      async function getUserInfo() {
        try {
          const response = await fetch(
            "https://people.googleapis.com/v1/people/me?personFields=names,emailAddresses,photos",
            {
              headers: {
                Authorization: `Bearer ${gapi.client.getToken().access_token}`,
              },
            }
          );

          if (!response.ok) {
            throw new Error("Failed to fetch user info");
          }

          const userInfo = await response.json();

          // 檢查用戶是否已註冊
          const member = await getMember(
            userInfo.emailAddresses[0].value,
            userInfo.names[0].displayName,
            "Google",
            userInfo.photos[0].url.split("=")[0]
          );
        } catch (err) {
          console.error("Error getting user info:", err);
        }
      }
    </script>
    <script
      async
      defer
      src="https://apis.google.com/js/api.js"
      onload="gapiLoaded()"
    ></script>
    <script
      async
      defer
      src="https://accounts.google.com/gsi/client"
      onload="gisLoaded()"
    ></script>

    <script
      async
      defer
      crossorigin="anonymous"
      src="https://connect.facebook.net/zh_TW/sdk.js"
    ></script>
    <script>
      window.fbAsyncInit = function () {
        FB.init({
          appId: "422390100774031",
          cookie: true,
          xfbml: true,
          version: "v20.0",
        });

        FB.AppEvents.logPageView();

        // 在這裡檢查登錄狀態
        FB.getLoginStatus(function (response) {
          console.log("FB初始化完成，登錄狀態：", response.status);
        });
      };
    </script>
    <script>
      function facebookLogin() {
        if (typeof FB !== "undefined") {
          FB.login(
            function (response) {
              console.log(response);
              if (response.authResponse) {
                var accessToken = response.authResponse.accessToken;

                if (response.status === "connected") {
                  console.log("status:connected");
                  FB.api(
                    "/me",
                    {
                      fields: "id,name,email,picture.width(200).height(200)",
                    },
                    async function (userData) {
                      if (userData && !userData.error) {
                        console.log("完整用戶資料:", userData);

                        // 檢查用戶是否已註冊
                        const member = await getMember(
                          userData.email,
                          userData.name,
                          "Facebook",
                          userData.picture.data.url
                        );
                      } else {
                        console.log(userData.error);
                        console.error(
                          "獲取用戶資料時發生錯誤:",
                          userData ? userData.error : "未知錯誤"
                        );
                        document.getElementById("status").innerHTML =
                          "無法獲取用戶資訊";
                      }
                    }
                  );
                } else {
                  console.log("Facebook 登入失敗");
                  // document.getElementById("status").innerHTML =
                  //   "Facebook 登入失敗";
                }
              }
            },
            { scope: "public_profile,email" }
          );
        } else {
          console.error("Facebook SDK 尚未加載完成");
          document.getElementById("status").innerHTML =
            "Facebook SDK 尚未準備就緒，請稍後再試";
        }
      }
    </script>
    <script>
      async function getMember(email, name, from, avatar) {
        var apiUrl = "/server/login.php";
        try {
          const response = await fetch(apiUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              email,
              name,
              from,
              avatar,
            }),
          });
          if (response.ok) {
            const data = await response.json();
            console.log("後端回應:", data);

            if (data.status === "existing") {
              login(data.data);
            } else if (data.status === "new") {
              login(data.data);
            } else {
            }
          }
        } catch (error) {
          console.error(error);
          throw error;
        }
      }
    </script>
    <script>
      function redirectToBackend() {
        window.location.href = "https://tarode.in/admin/login.php";
      }
    </script>
  </body>
</html>
