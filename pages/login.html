  <script type="text/javascript">

    const CLIENT_ID = '21293225703-jp231iscj743s6ril945n0ad8ql5qb9o.apps.googleusercontent.com';
    const API_KEY = 'AIzaSyBm7vO5EBLe9rT-4RmEHhb3f5-ExfU13Mc';

    const DISCOVERY_DOC = 'https://script.googleapis.com/$discovery/rest?version=v1';

    const SCOPES = 'https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email';

    let tokenClient;
    let gapiInited = false;
    let gisInited = false;

    document.getElementById('authorize_button').style.visibility = 'block';
    document.getElementById('signout_button').style.visibility = 'hidden';

    /**
     * Callback after api.js is loaded.
     */
    function gapiLoaded() {
      gapi.load('client', initializeGapiClient);
    }

    /**
     * Callback after the API client is loaded. Loads the
     * discovery doc to initialize the API.
     */
    async function initializeGapiClient() {
      try {
        await gapi.client.init({
          apiKey: API_KEY,
          discoveryDocs: [DISCOVERY_DOC],
        });

        gapiInited = true;
        // maybeEnableButtons();
        console.log('GAPI client initialized successfully');
      } catch (err) {
        console.error('Error initializing GAPI client:', err);
        document.getElementById('content').innerText = `Error initializing GAPI client: ${err.message}`;
      }
    }

    /**
     * Callback after Google Identity Services are loaded.
     */
    function gisLoaded() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: async (resp) => {
          if (resp.error !== undefined) {
            throw (resp);
          }
          console.log('callback');
          // document.getElementById('signout_button').style.display = 'block';
          // document.getElementById('authorize_button').style.display = 'none';
          await getUserInfo();
        },
      });
      gisInited = true;
      // maybeEnableButtons();
    }

    /**
     * Enables user interaction after all libraries are loaded.
     */
    function maybeEnableButtons() {
      if (gapiInited && gisInited) {
        const authButton = document.getElementById('authorize_button');
        // const signoutButton = document.getElementById('signout_button');
        const token = gapi.client.getToken();
        if (token === null) {
          // 如果未登入，顯示登入按鈕
          authButton.style.display = 'block';
          // signoutButton.style.display = 'none';
        } else {
          // 如果已登入，顯示登出按鈕
          authButton.style.display = 'none';
          // signoutButton.style.display = 'block';
        }
      }
    }

    /**
     *  Sign in the user upon button click.
     */
    function handleAuthClick() {
      // tokenClient.callback = async (resp) => {
      //   if (resp.error !== undefined) {
      //     throw (resp);
      //   }
      //   document.getElementById('signout_button').style.visibility = 'visible';
      //   document.getElementById('authorize_button').innerText = 'Refresh';
      //   console.log('Authorization successful, getUserInfo');
      //   await getUserInfo();
      // };
      const token = gapi.client.getToken();
      if (token === null) {
        // 顯示授權畫面
        tokenClient.requestAccessToken({ prompt: '' });
      } else {
        // 跳過授權畫面，直接使用令牌
        tokenClient.requestAccessToken({ prompt: '' });
      }
    }

    /**
     *  Sign out the user upon button click.
     */
    function handleSignoutClick() {
      const token = gapi.client.getToken();
      if (token !== null) {
        google.accounts.oauth2.revoke(token.access_token);
        gapi.client.setToken('');
        document.getElementById('content').innerText = '';
        document.getElementById('authorize_button').style.display = 'block';
        // document.getElementById('signout_button').style.display = 'none';
        // document.getElementById('authorize_button').innerText = 'Authorize';
        // document.getElementById('signout_button').style.visibility = 'hidden';
      }
    }

    async function getUserInfo() {
      try {
        const response = await fetch('https://people.googleapis.com/v1/people/me?personFields=names,emailAddresses', {
          headers: {
            'Authorization': `Bearer ${gapi.client.getToken().access_token}`
          }
        });

        if (!response.ok) {
          throw new Error('Failed to fetch user info');
        }

        const userInfo = await response.json();
        // document.getElementById('content').innerText = `
        //   Name: ${userInfo.names[0].displayName}
        //   Email: ${userInfo.emailAddresses[0].value}
        // `;

        // 檢查用戶是否已註冊
        const member = await getMember(userInfo.emailAddresses[0].value, userInfo.names[0].displayName);

      } catch (err) {
        console.error('Error getting user info:', err);
      }
    }

  </script>

      FB.init({

  <script>
    function facebookLogin() {
      if (typeof FB !== 'undefined') {
        FB.login(function (response) {
          console.log(response)
          if (response.authResponse) {
            var accessToken = response.authResponse.accessToken;

            if (response.status === 'connected') {
              console.log('status:connected');
              FB.api('/me', {
                fields: 'id,name,email',
                // access_token: accessToken  
              }, async function (userData) {
                if (userData && !userData.error) {
                  console.log('完整用戶資料:', userData);

                  // 檢查用戶是否已註冊
                  const member = await getMember(userData.email, userData.name);

                } else {
                  console.log(userData.error);
                  console.error('獲取用戶資料時發生錯誤:', userData ? userData.error : '未知錯誤');
                  document.getElementById('status').innerHTML = '無法獲取用戶資訊';
                }
              });
            } else {
              console.log('Facebook 登入失敗');
              document.getElementById('status').innerHTML = 'Facebook 登入失敗';
            }
          }

        }, { scope: 'public_profile,email' });

      } else {
        console.error('Facebook SDK 尚未加載完成');
        document.getElementById('status').innerHTML = 'Facebook SDK 尚未準備就緒，請稍後再試';
      }
    }
  </script>
  <script>
    async function getMember(email, name) {
      var apiUrl = '/server/login.php';
      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            email,
            name
          })
        })
        if (response.ok) {
          const data = await response.json();
          console.log('後端回應:', data);

          if (data.status === "existing") {
            document.getElementById('status').innerHTML = '歡迎回來，' + data.data.Name + '!';
            login(data.data.MNo);

          } else if (data.status === 'new') {
            document.getElementById('status').innerHTML = '新用戶註冊成功，' + data.data.Name + '!';
            login(data.data.MNo);
          } else {
            document.getElementById('status').innerHTML = '發生錯誤，請稍後再試';
          }
        }
      } catch (error) {
        console.error(error);
        throw error;
      }
    }
  </script>
