<script>
    Alpine.data("RentalDatas", () => ({
        init() {
            this.getRecords();
        },
        records: [],
        recordData: {},
        showRentalModal: false,
        files: [],
        AchievementDatas: {
            counterStarted: false,
        },
        timeoutSet: false,
        getRecords() {
            const apiUrl = '/server/routes.php?action=member_lease&MNo=' + localStorage.getItem('MNo');

            this.myFetch(apiUrl, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                },
            }, data => {
                // console.log(data);
                this.records = data;
            });
        },
        myFetch(apiUrl, options, resolve) {
            fetch(apiUrl, options)
                .then((res) => {
                    const contentType = res.headers.get("content-type");
                    if (!contentType || !contentType.includes("application/json")) {
                        console.log("非 JSON 格式資料");
                        res = res.text();
                    } else {
                        res = res.json();
                    }
                    return res;
                })
                .then(resolve)
                .catch((e) => console.log(e));
        },
        getImagePath(path) {
            let src = '';

            if (path) {
                src = `/Files/Gallery/${path}`;
            }
            if (!src) {
                src = 'https://tarode.in/asset/images/search-result-default-img.png';
            }
            return src;
        },
        openModal(record){
            this.recordData = record;
            if(record.FI_FILE){
                const files = this.record.FI_FILE.split(',');
                const filenames = this.record.FI_FILE_NAME.split(',');
                this.files = files.map((file, index) => ({ 
                    file: file,
                    filename: filenames[index] || file
                }));
            }else{
                this.files = [];
            }
            
            this.showRentalModal = true;
        },
        async download(){
            const zip = new JSZip();
            Promise.all(this.files.map(file =>
                fetch('/Files/Ingenious/'+file.file).then(resp => resp.blob().then(blob => {
                    return {
                        blob: blob,
                        fileName: file.filename
                    }
                }))
            ))
            .then(files => {
                files.forEach(file => {
                    zip.file(file.fileName, file.blob);
                })

                zip.generateAsync({ type: "blob" })
                .then(content => {
                    saveAs(content, `${this.recordData.bTitle}.zip`);
                });
            })
        },
        achievement(){
            // console.log(this.recordData);
            if(!this.AchievementDatas.counterStarted){
                setTimeout((recordData, myFetch) => {
                    const requestBody = {
                        MNo: localStorage.getItem('MNo'),
                        bookId: recordData.LeaseName,
                        Achievement: 'knowledge',
                    };

                    const apiUrl = '/server/routes.php?action=achievements';

                    myFetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(requestBody),
                    }, res => console.log(res));
                }, 10, this.recordData, this.myFetch);

                this.AchievementDatas.counterStarted = true;
            }
        },
        daily(){
            if(false === this.timeoutSet){
                setTimeout(myFetch => {
                    const requestBody = {
                        MNo: localStorage.getItem('MNo'),
                        Task: 'plan',
                    };

                    const apiUrl = '/server/routes.php?action=daily';

                    myFetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(requestBody),
                    }, data => {
                        if ('done!' === data) {
                            $('body').append(`
                            <div class="daily" x-data>
                                <div class="layer" @click="$root.classList.add('hidden')"></div>
                                <div class="wrap">
                                    <img src="../asset/images/Advanced_Filter_Books_Introduction/completed.png" />
                                    <p>恭喜你完成任務<br>
                                    獲得積分<strong>5點</strong></p>
                                    <button type="button" @click="$root.classList.add('hidden')">確定</button>
                                </div>
                            </div>`);
                        }
                    });
                }, 100, this.myFetch);

                this.timeoutSet = true;
            }
        }
    }));
</script>
<div x-data="RentalDatas">
    <ul class="rental-records">
        <template x-for="record in records">
            <li>
                <div class="image" :style="{
                    backgroundImage: `url(${getImagePath(record.IM_FILE)})`
                }" @click="recordData = record; showRentalModal = true;">
                </div>
                <div class="desc">
                    <h3 x-text="record.bTitle"></h3>
                    <div class="details">
                        <button class="rental-btn" type="button" @click="openModal(record)">教具資料</button>
                        <div><span>登記時間：</span><span x-text="record.CreatedDate.date.split(' ')[0]"></span></div>
                    </div>
                </div>
            </li>
        </template>
    </ul>

    <div class="popup-modal rental-modal" x-show="showRentalModal" x-cloak>
        <div class="modal-wrap">
            <h2>教具資料</h2>
            <div class="table">
                <div class="label">教具名稱</div>
                <div class="value" x-text="recordData.bTitle"></div>
                <div class="label">教具內容</div>
                <div class="value" x-html="(recordData.ShortDescrip||'').replace(/\n/g, '<br>')"></div>
                <div class="label">使用目的<span class="warn">*</span></div>
                <div class="value">
                    <div class="dropdown-wrap">
                        <input class="text-box" type="text" name="Purpose" :value="recordData.Purpose" readonly="">
                    </div>
                </div>
                <template x-if="'實體' === recordData.Modus">
                    <div class="label">聯繫人</div>
                </template>
                <template x-if="'實體' === recordData.Modus">
                    <div class="value">
                        <p class="mb-1em">實體教具請自行聯繫教具租借窗口:</p>
                        <p class="color-green">- 聯絡人：陳宛卿 小姐<br>
                        - 聯絡信箱：achen@mail.gov.tw<br>
                        - 聯絡電話：02-4856388#736</p>
                    </div>
                </template>
                <template x-if="files.length > 0">
                    <div class="label">內容下載</div>
                </template>
                <template x-if="files.length > 0">
                    <div class="value">
                        <button class="rental-btn" type="button" @click="download();achievement();daily()">教具下載</button>
                    </div>
                </template>
            </div>

            <div class="footer">
                <button class="submit" type="button" @click="showRentalModal = false">關閉</button>
            </div>
        </div>

        <div class="bg-cover" @click="showRentalModal = false"></div>
    </div>
</div>
