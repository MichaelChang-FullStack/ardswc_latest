<style>
  .page-content[class~="360-video-download-area"]{
    padding: 0;
    box-shadow: none;
  }
  .video-list {
    display: grid;
    gap: 12px;
    position: relative; /* 確保可以使用 offset 屬性 */
  }

  .video-card {
    display: flex;
    flex-direction: row;
    align-items: center;
    background-color: #ffffff;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
    position: relative;
    margin-bottom: 20px;
  }

  .video-img {
    position: relative;
    width: 250px; /* 固定寬度 */
    height: 145px;
    overflow: hidden;
    border-radius: 15px;
    margin-right: 20px;
  }

  .video-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 15px;
  }

  .video-img .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(70, 125, 30, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 15px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .video-img:hover .overlay {
    opacity: 1;
  }

  .view-content {
    color: #ffffff;
    font-family: "Noto Sans CJK TC";
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.16em;
  }

  .video-details {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 100%;
    padding-right: 20px;
  }

  .video-details h3 {
    font-family: "Noto Sans CJK TC";
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.16em;
    color: #000000;
    margin: 0;
  }

  .video-meta {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    margin-top: 10px;
  }

  .download-btn {
    padding: 10px 20px;
    background: #467d1e;
    color: #ffffff;
    border: none;
    border-radius: 25px;
    font-family: "Noto Sans CJK TC";
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.16em;
    cursor: pointer;
    margin-right: 20px;
    cursor: pointer;
  }

  .approval-date {
    font-family: "Noto Sans CJK TC";
    font-size: 16px;
    color: #467d1e;
  }

  .more-options {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 24px;
    color: #467d1e;
    cursor: pointer;
  }

  .video-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 11; /* 確保在覆蓋層上方 */
    width: 87px; /* 或設置為您需要的大小 */
    height: 87px; /* 或設置為您需要的大小 */
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    outline: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .overlay2 {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5); /* 半透明背景 */
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10; /* 確保在最上層 */
    font-size: 16px;
    font-weight: bold;
    opacity: 1; /* 常開顯示 */
    transition: none; /* 移除過渡效果 */
  }
  @media only screen and (max-width: 768px) {
    .video-download {
      width: 100%; /* 讓寬度自適應螢幕大小 */
      padding: 10px;
      left: 0; /* 去掉左邊距 */
      margin-left: 0;
    }

    .video-card {
      flex-direction: column; /* 將方向改為列，讓圖片和文字垂直排列 */
      align-items: flex-start;
    }

    .video-img {
      width: 100%; /* 讓圖片寬度自適應父容器 */
      height: auto;
      margin-right: 0; /* 去掉右邊距 */
    }

    .video-details {
      width: 100%;
      padding-top: 10px; /* 增加一些內邊距 */
    }

    .download-btn {
      width: 100%; /* 讓按鈕佔滿整行 */
      margin-top: 10px;
    }
  }
</style>

<div class="video-download">

                                </svg>
                            </button>
                            <div class="overlay"></div>
                        </div>
                        <div class="video-details">
                            <h3>${video.VideoName}</h3>
                            <br><br>
                            <div class="video-meta">
                                ${
                                  approvalStatus === "審核完成"
                                    ? `<button class="download-btn" onclick="downloadVideo('${video.VideoID}', '${video.VideoName}')">下載影片</button>
                                    <span class="approval-date">審核通過時間：${applyTime}</span>`
                                    : ""
                                }
                                ${
                                  approvalStatus === "待審核"
                                    ? `<span class="approval-date" style="color: #467D1E;">審核狀態：
                                        <span style="color: #0000FF;">${applyTime}</span>
                                    </span>`
                                    : ""
                                }
                                ${
                                  approvalStatus === "未通過"
                                    ? `<span class="approval-date" style="color: #467D1E;">審核狀態：
                                        <span style="color: #FF0000;">${applyTime}</span>
                                    </span>`

                                }
                                <div class="more-options">
                                    <span>...</span>

                        </div>
                    </div>
                `;
          $(".video-list").append(videoCard);
        });
      },
      error: function (xhr, status, error) {
        console.error("錯誤訊息:", error);
        alert("錯誤: " + xhr.responseText);
      },
    });
  });

  // 用於下載影片的函數
  function downloadVideo(bookId, title) {
    $.ajax({
      url: "/server/download360video.php", // 新增下載功能的 PHP 文件路徑
      type: "POST",
      data: JSON.stringify({ bookId: bookId }), // 傳遞 bookId 作為參數
      contentType: "application/json",
      dataType: "json",
      success: function (response) {
        if (response.length === 0) {
          alert("沒有找到影片數據。");
          return;
        }

        const downloadLink = `/Files/Videos/${bookId}.mp4`;
        // 創建一個隱藏的連結元素
        var link = document.createElement("a");
        link.href = downloadLink;
        link.download = title + ".mp4";
        // 模擬點擊下載連結
        document.body.appendChild(link);
        link.click();
        // 點擊後移除連結元素
        document.body.removeChild(link);
      },
      error: function (xhr, status, error) {
        console.error("下載影片時出錯:", error);
        alert("下載影片時出錯: " + xhr.responseText);
      },
    });
  }

  // 用於導向影片連結的函數
  function redirectionVideo(bookId) {
    $.ajax({
      url: "/server/download360video.php",
      type: "POST",
      data: JSON.stringify({ bookId: bookId }), // 傳遞 bookId 作為參數
      contentType: "application/json",
      dataType: "json",
      success: function (response) {
        if (response.length === 0) {
          alert("沒有找到影片數據。");
          return;
        }
        var urllink = window.location.origin;
        const downloadLink = `${urllink}/pages/Advanced_Filter_Video.html?bookId=${bookId}`;
        // 導向連結
        window.location.href = downloadLink;
      },
      error: function (xhr, status, error) {
        console.error("導向出錯:", error);
        alert("導向出錯: " + xhr.responseText);
      },
    });
  }
</script>
