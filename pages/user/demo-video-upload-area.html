
<style>
    .button {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        display: inline-block;
        position: relative;
    }

        .button .clip-default {
            display: block;
        }

        .button .clip-hover,
        .button .clip-active {
            display: none;
        }

        .button:hover .clip-default {
            display: none;
        }

        .button:hover .clip-hover {
            display: block;
        }

        .button:active .clip-hover,
        .button:active .clip-default {
            display: none;
        }

        .button:active .clip-active {
            display: block;
        }


    .selected svg path {
        fill: black;
        fill-opacity: 1;
    }

    .unselected svg path {
        fill: black;
        fill-opacity: 0.5;
    }


    .container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
    }

    svg {
        display: block;
        margin: 0 auto;
    }

    .button-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: flex-start;
        align-items: flex-start;
    }

    .button {
        background: none;
        border: none;
        padding: 0;
        margin: 0;
        cursor: pointer;
    }

    label {
        margin: 0 10px;
        font-size: 16px;
        line-height: 16px;
        color: black;
    }

    .svg-container {
        position: fixed;
        top: 60px;
        right: 0;
    }
    .second-svg-container {
        position: absolute;
        top: -35px;
        right: -30px;
        width: 150px;
        height: 60px;
        display: flex;
        justify-content: flex-end; /* 按鈕靠右對齊 */
        align-items: flex-start;   /* 按鈕靠上對齊 */
        overflow: hidden;          /* 隱藏超出範圍的部分 */
    }



    .button.second-button {
        position: absolute;
        top: 0;
        right: 0;
        background: none; /* 移除預設的按鈕背景 */
        border: none; /* 移除預設的按鈕邊框 */
        padding: 0;
        cursor: pointer;
    }

    .button.second-button svg {
        display: block;
    }
    .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #fff;
            padding: 40px;
            z-index: 9999;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            width: 450px;
            max-width: 90%;
            text-align: center;
        }

        .modal .button {
            margin-top: 20px;
            background-color: #467D1E;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            color: white;
            cursor: pointer;
        }

        .modal .button:hover {
            background-color: #5C9C25;
        }

        .modal .button:active {
            background-color: #334E1B;
        }

        .modal svg {
            margin-bottom: 20px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9998;
        }

        .close-button {
        position: absolute;
        top: 0;
        right: -50px;
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
    }

    .close-button svg {
        width: 40px;
        height: 40px;
        fill: black;
    }

    fileInput.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            console.log('選取的檔案:', file.name);

            // 檢查檔案大小
            if (file.size > 500 * 1024 * 1024) { // 500MB
                console.error('檔案大小超過500MB');
                return;
            }

            // 檢查影片格式
            if (!file.type.startsWith('video/')) {
                console.error('檔案格式不是影片');
                return;
            }

            const video = document.createElement('video');
            const url = URL.createObjectURL(file);

            video.addEventListener('loadedmetadata', function() {
                const duration = video.duration; // 影片長度（秒）
                const width = video.videoWidth;  // 影片寬度
                const height = video.videoHeight; // 影片高度

                // 檢查影片長度
                if (duration < 1 || duration > 3000) { // 1秒到3000秒
                    console.error('影片長度不在1秒到3000秒之間');
                    URL.revokeObjectURL(url);
                    return;
                }

                // 檢查解析度（這裡已經關閉）
                // if (width < 1920 || height < 1080) {
                //    console.error('影片解析度低於1080P');
                //    URL.revokeObjectURL(url);
                //    return;
                //}

                // 檔案符合要求，開始上傳
                uploadFile(file);
                URL.revokeObjectURL(url);
            });

            video.src = url;
        }
    });
    async function uploadFile(file) {
        // 顯示編輯視窗
        showEditingModal();

        const formData = new FormData();
        formData.append("videoFile", file);

        try {
            // 發送影片上傳請求
            const videoUploadResponse = await fetch('/server/uploaddemovideo.php', {
                method: "POST",
                body: formData
            });

            const uploadResult = await videoUploadResponse.json();

            if (!uploadResult.success) {
                // 如果上傳失敗，進行錯誤處理
                throw new Error(uploadResult.message || '影片上傳失敗');
            }

            //console.log('上傳成功:', uploadResult);
            //document.querySelector('#progress-text').textContent = '上傳成功！';

            // 初始化進度
            let progress = 0;
            let isInterrupted = false;
            let interval;

            // 開始進度條
            continueProgressToComplete();

            // 模擬3秒後上傳失敗
            simulateUploadFailure();

        } catch (error) {
            console.error('上傳影片時發生錯誤:', error);
            interruptProgressBar(); // 中斷進度條並顯示錯誤訊息
            document.querySelector('#progress-text').textContent = '上傳失敗：' + error.message;
        }
    }

    // 更新進度條
function updateProgressBar(percent, isError = false) {
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');

    if (!isError) { // 只有在未出現錯誤時才更新進度條
        progressBar.style.width = percent + '%';
        progressBar.style.backgroundColor = '#4caf50'; // 恢復為綠色
        progressText.textContent = percent + '% 完成';
    } else { // 如果出現錯誤
        progressBar.style.width = '100%'; // 鎖定進度條至100%
        progressBar.style.backgroundColor = 'red'; // 設置進度條為紅色
        progressText.textContent = '上傳失敗：請重試';
    }
}

// 檢查中斷並更新進度條
function checkAndUpdateProgress() {
    if (isInterrupted) { // 如果已經中斷，停止更新並清除計時器
        clearInterval(interval);
        updateProgressBar(15, true); // 顯示中斷後的錯誤訊息
    } else {
        progress += 10; // 每次增加10%
        updateProgressBar(progress);
        if (progress >= 100) {
            clearInterval(interval);
        }
    }
}

// 中斷進度條並將其轉為紅色
function interruptProgressBar() {
    isInterrupted = true; // 設置中斷標誌
    updateProgressBar(progress, true); // 立即將進度條轉為紅色並顯示錯誤訊息
}

// 繼續執行進度條至完成
function continueProgressToComplete() {
    clearInterval(interval); // 清除之前的進度模擬
    interval = setInterval(() => {
        progress += 10;
        if (progress > 100) {
            progress = 100;
        }
        updateProgressBar(progress);
        if (progress >= 100) {
            clearInterval(interval);
            if (!isInterrupted) { // 確保沒有中斷才顯示完成訊息
                document.querySelector('#progress-text').textContent = '上傳完成！';
            }
        }
    }, 500); // 每0.5秒更新一次
}

// 例如，在上傳過程中檢查是否失敗並呼叫 interruptProgressBar()。
function simulateUploadFailure() {
    setTimeout(() => {
        interruptProgressBar(); // 模擬上傳失敗，呼叫中斷函數
    }, 3000); // 3秒後模擬失敗
}


    // 用於關閉模態視窗
    function closeEditingModal() {
        const modal = document.querySelector('div[style*="position: fixed"]');
        const overlay = document.querySelector('div[style*="backgroundColor: rgba(0, 0, 0, 0.5)"]');
        if (modal) {
            document.body.removeChild(modal);
        }
        if (overlay) {
            document.body.removeChild(overlay);
        }
    }
