<style>
  .button .clip-default {
    display: block;
  }

  .button .clip-hover,
  .button .clip-active {
    display: none;
  }

  .button:hover .clip-default {
    display: none;
  }

  .button:hover .clip-hover {
    display: block;
  }

  .button:active .clip-hover,
  .button:active .clip-default {
    display: none;
  }

  .button:active .clip-active {
    display: block;
  }

  .selected svg path {
    fill: black;
    fill-opacity: 1;
  }

  .unselected svg path {
    fill: black;
    fill-opacity: 0.5;
  }

  .container {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
  }

  .button-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: flex-start;
    align-items: flex-start;
  }

  .button {
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
  }

  label {
    margin: 0 10px;
    font-size: 16px;
    line-height: 16px;
    color: black;
  }

  .svg-container {
    position: fixed;
    top: 60px;
    right: 0;
  }
  .second-svg-container {
    position: absolute;
    top: -35px;
    right: -30px;
    width: 150px;
    height: 60px;
    display: flex;
    justify-content: flex-end; /* 按鈕靠右對齊 */
    align-items: flex-start; /* 按鈕靠上對齊 */
    overflow: hidden; /* 隱藏超出範圍的部分 */
  }

  .button.second-button {
    position: absolute;
    top: 0;
    right: 0;
    background: none; /* 移除預設的按鈕背景 */
    border: none; /* 移除預設的按鈕邊框 */
    padding: 0;
    cursor: pointer;
  }

  .button.second-button svg {
    display: block;
  }
  .modal {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background-color: #fff;
    padding: 40px;
    z-index: 9999;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    border-radius: 20px;
    width: 450px;
    max-width: 90%;
    text-align: center;
  }

  .modal .button {
    margin-top: 20px;
    background-color: #467d1e;
    border: none;
    border-radius: 5px;
    padding: 10px 20px;
    color: white;
    cursor: pointer;
  }

  .modal .button:hover {
    background-color: #5c9c25;
  }

  .modal .button:active {
    background-color: #334e1b;
  }

  .modal svg {
    margin-bottom: 20px;
  }

  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 9998;
  }

  .close-button {
    position: absolute;
    top: 0;
    right: -50px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
  }

  .close-button svg {
    width: 40px;
    height: 40px;
    fill: black;
  }
</style>

<script>
  async function fetchData() {
    const dataToSend = {
      mno: localStorage.getItem("MNo"), // 從 localStorage 中獲取 MNo
    };

    try {
      const response = await fetch("/server/reviewVideoData.php", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify(dataToSend),
      });
      const responseData = await response.json();

      if (response.ok && responseData.success) {
        const data = responseData.data;

        // 清空現有的模態視窗內容
        const container = document.getElementById("reviewButtontextalign");
        container.innerHTML = "";

        // 遍歷所有返回的數據
        data.forEach((item) => {
          // 動態創建並插入模態視窗內容
          const modal = document.createElement("div");
          modal.className = "modal-item";
          modal.style.width = "100%"; // 使用相對寬度，讓模態視窗自適應寬度
          modal.style.maxWidth = "350px";
          modal.style.height = "408px"; // 固定高度為408px
          modal.style.margin = "12px"; // 設置間距以確保均勻分布
          modal.style.display = "inline-block"; // 確保每個模態框為行內塊元素
          modal.style.borderRadius = "15px";
          modal.style.background = "#FFFFFF";
          modal.style.boxShadow = "0px 5px 10px rgba(0, 0, 0, 0.1)";
          modal.style.overflow = "hidden"; // 防止內容超出邊界

          // 創建一個相對定位的容器來包裹 video 和 durationLabel
          const videoContainer = document.createElement("div");
          videoContainer.style.position = "relative";

          const video = document.createElement("video");
          video.src = item.video_url;
          video.style.width = "100%"; // 設置影片寬度
          video.style.height = "258px"; // 圖片高度
          video.style.borderRadius = "15px 15px 0 0"; // 圖片上方圓角
          video.style.objectFit = "cover"; // 確保影片填滿範圍
          video.style.pointerEvents = "none"; // 禁用用戶交互來隱藏播放條
          video.controls = false; // 禁用控制條
          video.muted = true; // 靜音影片
          video.loop = true; // 使影片循環播放
          video.style.opacity = "0.5"; // 設置影片的透明度
          video.style.borderRadius = "15px";

          const durationLabel = document.createElement("div");
          durationLabel.style.position = "absolute";
          durationLabel.style.width = "45px"; // 設置影片寬度
          durationLabel.style.height = "21px"; // 圖片高度
          durationLabel.style.right = "10px";
          durationLabel.style.bottom = "30px";
          durationLabel.style.background = "rgba(0, 0, 0, 0.5)";
          durationLabel.style.color = "#FFFFFF";
          durationLabel.style.padding = "2px 5px";
          durationLabel.style.borderRadius = "5px";
          durationLabel.style.fontSize = "14px";
          durationLabel.style.textAlign = "center";
          // 設置影片加載後顯示總時長
          video.addEventListener("loadedmetadata", () => {
            const totalDuration = video.duration;
            const minutes = Math.floor(totalDuration / 60);
            const seconds = Math.floor(totalDuration % 60);
            durationLabel.textContent = `${minutes}:${
              seconds < 10 ? "0" : ""
            }${seconds}`;
          });

          // 將 video 和 durationLabel 添加到 videoContainer
          videoContainer.appendChild(video);
          videoContainer.appendChild(durationLabel);

          // 將 videoContainer 添加到模態框中
          modal.appendChild(videoContainer);

          function truncateText(text, maxUnits) {
            let unitCount = 0;
            let truncatedText = "";

            for (let i = 0; i < text.length; i++) {
              const char = text[i];

              // 判斷是否為全形字（中文、日文、韓文等）
              if (char.match(/[\u4e00-\u9fff\u3400-\u4dbf\uff01-\uff60]/)) {
                unitCount += 1.5; // 全形字佔 2 個單位
              } else {
                unitCount += 1; // 半形字佔 1 個單位
              }

              // 如果超出最大單位限制，結束迴圈並加上省略號
              if (unitCount > maxUnits) {
                truncatedText += "...";
                break;
              }

              truncatedText += char;
            }

            return truncatedText;
          }

          const title = document.createElement("h4");
          title.style.fontFamily = "'Noto Sans CJK TC'";
          title.style.fontWeight = "700";
          title.style.fontSize = "20px";
          title.style.color = "#000000";
          title.style.lineHeight = "30px";
          title.style.letterSpacing = "0.16em";
          title.style.margin = "15px 10px"; // 調整標題的間距
          title.style.textAlign = "left";

          // 設定最多顯示 24 個單位（14 個全形字或 28 個半形字，或兩者混合）
          const maxUnits = 18;
          const truncatedTitle = truncateText(item.title, maxUnits);
          title.innerText = truncatedTitle;

          const button = document.createElement("button2");
          button.style.display = "flex";
          button.style.flexDirection = "column";
          button.style.justifyContent = "center";
          button.style.alignItems = "center";
          button.style.padding = "0px";
          button.style.gap = "8px";

          button.style.position = "flex";
          button.style.width = "95px";
          button.style.height = "40px";

          button.style.background = "#767879";
          button.style.borderRadius = "100px";

          // styleName: h6_medium;
          button.style.fontFamily = "'Noto Sans CJK TC'";
          button.style.fontSize = "14px";
          button.style.fontWeight = "500";
          button.style.lineHeight = "21px";
          button.style.letterSpacing = "0.16em";
          button.style.textAlign = "center";
          button.style.color = "#FFFFFF";
          button.style.margin = "15px 10px";
          button.innerText = "審核中";

          // 將標題和按鈕添加到模態框中
          modal.appendChild(title);
          modal.appendChild(button);

          // 將模態框插入到指定的容器中
          container.appendChild(modal);
        });

        // 顯示容器並設置flexbox佈局
        const reviewButtontextalign = document.getElementById(
          "reviewButtontextalign"
        );
        reviewButtontextalign.style.display = "flex";
        reviewButtontextalign.style.flexDirection = "column"; // 縱向排列
        reviewButtontextalign.style.alignItems = "center"; // 居中對齊
        reviewButtontextalign.style.padding = "20px"; // 添加內邊距讓內容有空間
        reviewButtontextalign.style.display = "block"; // 顯示容器
      } else {
        throw new Error(responseData.message || "获取数据失败");
      }
    } catch (error) {
      console.error("錯誤訊息:", error);
    }
  }

  // 生成 UUID 的函數
  function generateUUID() {
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(
      /[xy]/g,
      function (c) {
        const r = (Math.random() * 16) | 0;
        const v = c === "x" ? r : (r & 0x3) | 0x8;
        return v.toString(16);
      }
    );
  }

  // 獲取檔案擴展名的函數
  function getFileExtension(fileName) {
    return fileName.split(".").pop();
  }

  async function uploadFile(file) {
    const formData = new FormData();
    formData.append("videoFile", file);

    try {
      // 使用 XMLHttpRequest 來監控上傳進度
      const xhr = new XMLHttpRequest();

      // 初始化進度條
      let progress = 0;
      let isInterrupted = false;

      // 監聽上傳進度事件
      // 初始化變量來追蹤下一個更新點
      let nextUpdateThreshold = 10;

      // 監聽上傳進度事件
      xhr.upload.onprogress = function (event) {
        if (event.lengthComputable) {
          progress = (event.loaded / event.total) * 100;

          // 每超過10%進行一次更新
          if (progress >= nextUpdateThreshold) {
            updateProgressBar(nextUpdateThreshold); // 更新進度條到下一個10%
            nextUpdateThreshold += 10; // 將門檻值增加10%
          }
        }
      };

      xhr.open("POST", "/server/uploaddemovideo.php");

      const uploadPromise = new Promise((resolve, reject) => {
        xhr.onload = function () {
          if (xhr.status === 200) {
            const uploadResult = JSON.parse(xhr.responseText);
            if (uploadResult.success) {
              updateProgressBar(100);
              resolve(uploadResult);
            } else {
              reject(new Error(uploadResult.message || "影片上傳失敗"));
            }
          } else {
            reject(new Error("上傳失敗"));
          }
        };

        xhr.onerror = function () {
          reject(new Error("上傳時發生錯誤"));
        };
      });

      xhr.send(formData);

      return await uploadPromise;
    } catch (error) {
      console.error("上傳影片時發生錯誤:", error);
      interruptProgressBar(); // 中斷進度條並顯示錯誤訊息
      document.querySelector("#progress-text").textContent =
        "上傳失敗：" + error.message;

      // 在模態視窗中顯示錯誤訊息
      showEditingModal(true);
      throw error; // 繼續拋出錯誤以便上層捕捉
    }
  }

    suggestions.style.maxHeight = "200px"; // 最大高度，超過後會出現滾動條
    suggestions.style.overflowY = "auto"; // 啟用垂直滾動

    // 將 suggestions 容器添加到模態框中
    modal.appendChild(suggestions);
    document.body.appendChild(modal);

    document
      .getElementById("leasename")
      .addEventListener("keydown", function () {
        if (event.key === "Enter") {
          event.preventDefault(); // 阻止 Enter 鍵換行
        }
      });

    let matchedLeaseName = ""; // 用來保存與搜尋結果吻合的 leaseName
    // 綁定事件，處理關鍵字搜尋
    document.getElementById("leasename").addEventListener("keyup", function () {
      var leaseName = this.value;
      if (leaseName.length > 0) {
        // 當輸入長度大於1時進行搜尋
        fetch("/server/fetch_options.php", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ search: leaseName }),
        })
          .then((response) => response.json())
          .then((data) => {
            suggestions.innerHTML = "";
            if (data.success) {
              data.data.forEach((item) => {
                var div = document.createElement("div");
                div.textContent = item.lease_name;
                div.style.padding = "5px";
                div.style.cursor = "pointer";
                div.addEventListener("click", function () {
                  document.getElementById("leasename").value = item.lease_name;
                  matchedLeaseName = item.lease_name; // 保存匹配的名稱
                  suggestions.style.display = "none";
                });
                suggestions.appendChild(div);
              });
              suggestions.style.display = "block";
            } else {
              suggestions.style.display = "none";
            }
          });
      } else {
        suggestions.style.display = "none";
      }
    });
    // 點擊其他地方時隱藏 suggestions
    document.addEventListener("click", function (event) {
      const leasenameInput = document.getElementById("leasename");

      // 檢查點擊是否發生在 leasename 或 suggestions 內部
      if (
        !leasenameInput.contains(event.target) &&
        !suggestions.contains(event.target)
      ) {
        suggestions.style.display = "none";
      }
    });

    // 綁定清除按鈕的點擊事件
    document
      .getElementById("clearButton")
      .addEventListener("click", function () {
        // 刷新頁面
        window.location.reload();
      });

    document
      .getElementById("closeButton")
      .addEventListener("click", function () {
        // 找到並移除模態視窗元素及其覆蓋層
        if (overlay) overlay.remove(); // 移除覆蓋層
        if (modal) modal.remove(); // 移除模態視窗
      });
    // 綁定提交按鈕的點擊事件
    document
      .getElementById("submitFormButton")
      .addEventListener("click", async function () {
        const progressText2 = document.getElementById("progress-text2");
        const submitFormButton = document.getElementById("submitFormButton");
        const clearButton = document.getElementById("clearButton");
        const leaseNameInput = document
          .getElementById("leasename")
          .value.trim();
        // 禁用提交按鈕以防止重複點擊
        submitFormButton.disabled = true;

        // 準備要提交的 JSON 資料
        const dataToSend = {
          leasename: leaseNameInput,
          field: document.getElementById("field").value.trim(),
          suitable: document.getElementById("suitable").value.trim(),
          time: document.getElementById("time").value.trim(),
          memo: document.getElementById("memo").value.trim(),
          videoid: fileName, // 設定影片檔案名稱
          mno: localStorage.getItem("MNo"), // 從 localStorage 中獲取 MNo
        };

        // 檢查每一個欄位是否有資料，排除 videoid 欄位
        let missingData = false;
        for (const key in dataToSend) {
          if (
            key !== "videoid" &&
            (dataToSend[key] === "" ||
              dataToSend[key] === null ||
              dataToSend[key] === undefined)
          ) {
            missingData = true;
            break;
          }
        }
        // 新增檢查：確認輸入的 leaseName 是否與搜尋結果吻合
        if (leaseNameInput !== matchedLeaseName) {
          progressText2.textContent =
            "※教具名稱未填寫確實，請確認是否與現有資源一致";
          clearButton.style.transform = `translateY(-49px)`;
          submitFormButton.style.transform = `translateY(-49px)`;
          submitFormButton.disabled = false; // 重新啟用提交按鈕
          return; // 阻止後續的提交邏輯
        }
        if (missingData) {
          // 如果有缺少資料，顯示提示信息並阻止表單提交
          progressText2.textContent = "※資料未填寫確實，請再檢查後送出";
          clearButton.style.transform = `translateY(-49px)`;
          submitFormButton.style.transform = `translateY(-49px)`;
          return; // 阻止後續的提交邏輯
        } else {
          progressText2.textContent = "";
        }

        // 啟動進度條並上傳檔案
        try {
          const uploadResult = await uploadFile(file); // 確保上傳完成後檢查結果

          if (!uploadResult.success) {
            // 如果上傳失敗，拋出錯誤
            throw new Error(uploadResult.message || "影片上傳失敗");
          }

          // 發送資料到後端
          const response = await fetch("/server/submitMemberUpload.php", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(dataToSend),
          });

          const responseData = await response.json();

          if (response.ok && responseData.success) {
            await addNews("approve");
            // 顯示成功訊息並刷新頁面
            alert("提交成功");
            reviewButton.click();
            if (overlay) overlay.remove(); // 移除覆蓋層
            if (modal) modal.remove(); // 移除模態視窗
          } else {
            throw new Error(responseData.message || "提交失敗");
          }
        } catch (error) {
          console.error("發送資料時發生錯誤:", error);
        }
      });
    async function addNews(status) {
      var url = window.location.origin;
      const data = {
        action: "create",
        subject: "",
        SOURCE_NO: `${url}/pages/user.html?page=demo-video-upload-area&type=2`,
        CATEGORY_NO: 0,
        CATEGORY: "",
        MNo: localStorage.getItem("MNo"),
      };

      // 根据 status 设置 subject 和 content
      switch (status) {
        case "approve":
          data.CATEGORY_NO = 15;
          data.CATEGORY = "試教影片";
          data.subject = "試教影片已成功上傳。";
          break;
        default:
          subject = "";
          content = ``;
          break;
      }

      try {
        const response = await fetch("/server/userNews.php", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(data),
        });

        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const result = await response.json();
        console.log("Server response:", result);
      } catch (error) {
        console.error("Error:", error);
      }
    }
  }

  // 更新進度條
  function updateProgressBar(percent, isError = false) {
    const progressBar = document.getElementById("progress-bar");
    const progressText = document.getElementById("progress-text");
    const progressMessage = document.getElementById("progress-message");
    const progressText2 = document.getElementById("progress-text2");
    const textarea = document.getElementById("textarea");
    const field = document.getElementById("field");
    const suitable = document.getElementById("suitable");
    const time = document.getElementById("time");
    const submitFormButton = document.getElementById("submitFormButton");
    const clearButton = document.getElementById("clearButton");
    const uploadprogress = document.getElementById("upload-progress");
    const memo = document.getElementById("memo");
    uploadprogress.style.display = "block";
    textarea.style.transform = `translateY(-27.5px)`;
    field.style.transform = `translateY(-27.5px)`;
    suitable.style.transform = `translateY(-28.5px)`;
    time.style.transform = `translateY(-28.5px)`;
    memo.style.transform = `translateY(-28.5px)`;
    clearButton.style.transform = `translateY(-27.5px)`;
    submitFormButton.style.transform = `translateY(-27.5px)`;
    if (isError) {
      progressBar.style.width = "100%";
      progressBar.style.backgroundImage =
        'url("/Files/Png/failure-progress-bar.png")';
      progressBar.style.backgroundSize = "cover";
      progressBar.style.backgroundRepeat = "no-repeat";
      progressText.textContent = "上傳失敗：請重試";
      submitFormButton.disabled = false;

      // 檢查每一個欄位是否有資料，排除 videoid 欄位
      let missingData = false;
      if (
        textarea.textContent === "" ||
        field.textContent === "請選擇" ||
        suitable.textContent === "請選擇" ||
        time.textContent === "請選擇"
      ) {
        missingData = true;
      }

      if (missingData) {
        // 如果有缺少資料，顯示提示信息並阻止表單提交
        progressText2.textContent = "※資料未填寫確實，請再檢查後送出";
      } else {
        progressText2.textContent = "";
      }
    } else {
      progressBar.style.width = percent + "%";
      progressBar.style.backgroundSize = "cover";
      progressBar.style.backgroundRepeat = "no-repeat";
      progressBar.style.color = "white";
      progressBar.style.textAlign = "left";
      progressBar.style.paddingLeft = "15%";
      progressBar.style.lineHeight = "15px";
      progressBar.style.backgroundColor = "transparent";
      if (percent >= 15) {
        progressBar.style.backgroundImage = 'url("/Files/Png/success15.png")';
        progressBar.textContent = "15%";
        progressText.textContent = "檔案上傳中 ...";
        submitFormButton.disabled = true;
      }
      if (percent >= 30) {
        progressBar.style.backgroundImage = 'url("/Files/Png/success30.png")';
        progressBar.textContent = "30%";
        progressText.textContent = "檔案上傳中 ...";
        submitFormButton.disabled = true;
      }
      if (percent >= 50) {
        progressBar.style.backgroundImage = 'url("/Files/Png/success50.png")';
        progressBar.textContent = "50%";
        progressText.textContent = "檔案上傳中 ...";
        submitFormButton.disabled = true;
      }
      if (percent >= 70) {
        progressBar.style.backgroundImage = 'url("/Files/Png/success70.png")';
        progressBar.textContent = "70%";
        progressText.textContent = "檔案上傳中 ...";
        submitFormButton.disabled = true;
      }
      if (percent >= 100) {
        progressBar.style.backgroundImage = 'url("/Files/Png/success100.png")';
        progressText.textContent = "";
        submitFormButton.disabled = true;
      }
    }

    if (percent === 100 || isError) {
      let progressBarColor = isError ? "#CF1F1F" : "#4caf50";
      let finalProgressText = isError ? "上傳失敗" : "檔案上傳成功";
      let progressMessageText = isError ? "上傳失敗：請重試" : "上傳完成！";
      let finalProgressText2 = isError
        ? "※資料未填寫確實，請再檢查後送出"
        : " ";

      progressBar.textContent = "";
      progressBar.style.backgroundColor = progressBarColor;
      progressText.textContent = finalProgressText;
      progressText.style.color = progressBarColor;
      if (progressMessage) {
        progressMessage.textContent = progressMessageText;
      }
      progressText2.textContent = finalProgressText2;
      progressText2.style.color = progressBarColor;
    }
  }

  // 檢查中斷並更新進度條
  function checkAndUpdateProgress() {
    if (isInterrupted) {
      // 如果已經中斷，停止更新並清除計時器
      clearInterval(interval);
      updateProgressBar(15, true); // 顯示中斷後的錯誤訊息
    } else {
      progress += 10; // 每次增加10%
      updateProgressBar(progress);
      if (progress >= 100) {
        clearInterval(interval); // 停止進度更新
      }
    }
  }

  // 中斷進度條並將其轉為紅色
  function interruptProgressBar() {
    isInterrupted = true; // 設置中斷標誌
    updateProgressBar(progress, true); // 立即將進度條轉為紅色並顯示錯誤訊息
  }

  // 初始化並啟動進度條
  function startProgressBar() {
    progress = 0; // 重置進度
    isInterrupted = false; // 重置中斷標誌
    interval = setInterval(checkAndUpdateProgress, 1000); // 每秒更新進度
  }

  // 用於關閉模態視窗
  function closeEditingModal() {
    const modal = document.querySelector('div[style*="position: fixed"]');
    const overlay = document.querySelector(
      'div[style*="backgroundColor: rgba(0, 0, 0, 0.5)"]'
    );
    if (modal) {
      document.body.removeChild(modal);
    }
    if (overlay) {
      document.body.removeChild(overlay);
    }
  }
</script>
