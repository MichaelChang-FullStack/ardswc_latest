<style>
  .button .clip-default {
    display: block;
  }

  .button .clip-hover,
  .button .clip-active {
    display: none;
  }

  .button:hover .clip-default {
    display: none;
  }

  .button:hover .clip-hover {
    display: block;
  }

  .button:active .clip-hover,
  .button:active .clip-default {
    display: none;
  }

  .button:active .clip-active {
    display: block;
  }

  .selected svg path {
    fill: black;
    fill-opacity: 1;
  }

  .unselected svg path {
    fill: black;
    fill-opacity: 0.5;
  }

  .container {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
  }

  .button-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: flex-start;
    align-items: flex-start;
  }

  .button {
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    cursor: pointer;
  }

  label {
    margin: 0 10px;
    font-size: 16px;
    line-height: 16px;
    color: black;
  }

  .svg-container {
    position: fixed;
    top: 60px;
    right: 0;
  }
  .second-svg-container {
    position: absolute;
    top: 50%;
    right: 0;
    transform: translateY(-50%);
  }

  .button.second-button {
    border: 1px solid #467d1e;
    padding: 6px 12px;
    background-color: #467d1e;
    color: #FFF;
    border-radius: 4px;
    cursor: pointer;
    font-family: Noto Sans CJK TC;
    font-size: 16px;
    line-height: 1.5;
  }
  .button.second-button:hover{
    color: #467d1e;
    background-color: #FFF;
  }

  .modal {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background-color: #fff;
    padding: 30px 40px;
    z-index: 9999;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    border-radius: 20px;
    width: 450px;
    max-width: 90%;
    text-align: center;
  }

  .modal .button {
    margin-top: 20px;
    background-color: #467d1e;
    border: none;
    border-radius: 5px;
    padding: 10px 20px;
    color: white;
    cursor: pointer;
  }

  .modal .button:hover {
    background-color: #5c9c25;
  }

  .modal .button:active {
    background-color: #334e1b;
  }

  .modal svg {
    margin-bottom: 20px;
  }

  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 9998;
  }

  .close-button {
    position: absolute;
    top: 0;
    right: -50px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
  }

  .close-button svg {
    width: 40px;
    height: 40px;
    fill: black;
  }

  #uploadButtontextalign.grid,
  #reviewButtontextalign{
    margin-top: 30px;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 24px;
  }

  .body-modal{
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background-color: #fff;
    padding: 40px;
    z-index: 9999;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    border-radius: 20px;
    width: 660px;
    height: 90vh;
    max-width: 90%;
    max-height: 90%;
    text-align: center;
  }

  .body-modal-wrapper{
    height: 100%;
    overflow: auto;
    scrollbar-width: none;
    padding-bottom: 10px;
  }

  .body{
    text-align: left;
  }
  .body-content label {
    display: block;
    margin: 0;
    line-height: 1.5;
    margin-bottom: 8px;
    font-weight: bold!important;
  }

  .body .body-content{
    margin-top: 20px;
  }

  .body .warn {
    font-family: Noto Sans CJK TC;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.5;
    letter-spacing: 0.16em;
    color: #f00;
    margin: 16px 0;
  }
  .body-content textarea,
  .body-content input[type="text"]{
    margin-bottom: 10px;
  }

  .body button {
    padding: 13px 30px;
    border-radius: 25px;
    border: 2px solid;
    box-shadow: 0px 3px 5px 0px #0000001A;
    background: none;
    margin-bottom: 0;
    font-family: Noto Sans CJK TC;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.16em;
    line-height: 1.5;
    text-align: center;
    cursor: pointer;
    transition: background-color .6s;
    color: #6A6C6E;
  }

  #submitFormButton{
    color: #467D1E;
  }

  #upload-progress{
    background-color: #E9ECEF;
    border-radius: 4px;
    overflow: hidden;
  }

  .body-modal .body-modal-close{
    position: absolute;
    top: 0;
    right: -48px;
    width: 40px;
    height: 40px;
  }

  @media screen and (max-width: 768px) {
    #uploadButtontextalign,
    #reviewButtontextalign{
      grid-template-columns: repeat(1, minmax(0, 1fr));
    }

    .body-modal{
      position: fixed;
      max-width: 96%;
      overflow: auto;
      scrollbar-width: none;
    }

    .body-modal .body-modal-close{
      right: 4px;
      top: 4px;
      box-shadow: none;
    }
  }
  
</style>

<div id="reviewButtontextalign" style="text-align: left; display: none">
  <!-- 模态窗口的容器 -->
</div>
<script>
  async function fetchData() {
    const dataToSend = {
      mno: localStorage.getItem("MNo"), // 從 localStorage 中獲取 MNo
    };

    try {
      const response = await fetch("/server/reviewVideoData.php", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify(dataToSend),
      });
      const responseData = await response.json();

      if (response.ok && responseData.success) {
        const data = responseData.data;

        // 清空現有的模態視窗內容
        const container = document.getElementById("reviewButtontextalign");
        container.innerHTML = "";

        // 遍歷所有返回的數據
        data.forEach((item) => {
          // 動態創建並插入模態視窗內容
          const modal = document.createElement("div");
          modal.className = "modal-item";
          modal.style.width = "100%"; // 使用相對寬度，讓模態視窗自適應寬度
          // modal.style.maxWidth = "350px";
          modal.style.height = "408px"; // 固定高度為408px
          // modal.style.margin = "12px"; // 設置間距以確保均勻分布
          modal.style.display = "inline-block"; // 確保每個模態框為行內塊元素
          modal.style.borderRadius = "15px";
          modal.style.background = "#FFFFFF";
          modal.style.boxShadow = "0px 5px 10px rgba(0, 0, 0, 0.1)";
          modal.style.overflow = "hidden"; // 防止內容超出邊界

          // 創建一個相對定位的容器來包裹 video 和 durationLabel
          const videoContainer = document.createElement("div");
          videoContainer.style.position = "relative";

          const video = document.createElement("video");
          video.src = item.video_url;
          video.style.width = "100%"; // 設置影片寬度
          video.style.height = "258px"; // 圖片高度
          video.style.borderRadius = "15px 15px 0 0"; // 圖片上方圓角

  // 生成 UUID 的函數
  function generateUUID() {
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(
      /[xy]/g,
      function (c) {
        const r = (Math.random() * 16) | 0;
        const v = c === "x" ? r : (r & 0x3) | 0x8;
        return v.toString(16);
      }
    );
  }

  // 獲取檔案擴展名的函數
  function getFileExtension(fileName) {
    return fileName.split(".").pop();
  }

  async function uploadFile(file) {
    const formData = new FormData();
    formData.append("videoFile", file);

    try {
      // 使用 XMLHttpRequest 來監控上傳進度
      const xhr = new XMLHttpRequest();

      // 初始化進度條
      let progress = 0;
      let isInterrupted = false;

      // 監聽上傳進度事件
      // 初始化變量來追蹤下一個更新點
      let nextUpdateThreshold = 10;

      // 監聽上傳進度事件
      xhr.upload.onprogress = function (event) {
        if (event.lengthComputable) {
          progress = (event.loaded / event.total) * 100;

          // 每超過10%進行一次更新
          if (progress >= nextUpdateThreshold) {
            updateProgressBar(nextUpdateThreshold); // 更新進度條到下一個10%
            nextUpdateThreshold += 10; // 將門檻值增加10%
          }
        }
      };

      xhr.open("POST", "/server/uploaddemovideo.php");

      const uploadPromise = new Promise((resolve, reject) => {
        xhr.onload = function () {
          if (xhr.status === 200) {
            const uploadResult = JSON.parse(xhr.responseText);
            if (uploadResult.success) {
              updateProgressBar(100);
              resolve(uploadResult);
            } else {
              reject(new Error(uploadResult.message || "影片上傳失敗"));
            }
          } else {
            reject(new Error("上傳失敗"));
          }
        };

        xhr.onerror = function () {
          reject(new Error("上傳時發生錯誤"));
        };
      });

      xhr.send(formData);

      return await uploadPromise;
    } catch (error) {
      console.error("上傳影片時發生錯誤:", error);
      interruptProgressBar(); // 中斷進度條並顯示錯誤訊息
      document.querySelector("#progress-text").textContent =
        "上傳失敗：" + error.message;

      // 在模態視窗中顯示錯誤訊息
      showEditingModal(true);
      throw error; // 繼續拋出錯誤以便上層捕捉
    }
  }

        progressText2.textContent = "";

      progressBar.style.backgroundRepeat = "no-repeat";
      progressBar.style.color = "white";
      progressBar.style.textAlign = "left";

  // 檢查中斷並更新進度條
  function checkAndUpdateProgress() {
    if (isInterrupted) {
      // 如果已經中斷，停止更新並清除計時器
      clearInterval(interval);
      updateProgressBar(15, true); // 顯示中斷後的錯誤訊息
    } else {
      progress += 10; // 每次增加10%
      updateProgressBar(progress);
      if (progress >= 100) {
        clearInterval(interval); // 停止進度更新
      }
    }
  }

  // 中斷進度條並將其轉為紅色
  function interruptProgressBar() {
    isInterrupted = true; // 設置中斷標誌
    updateProgressBar(progress, true); // 立即將進度條轉為紅色並顯示錯誤訊息
  }

  // 初始化並啟動進度條
  function startProgressBar() {
    progress = 0; // 重置進度
    isInterrupted = false; // 重置中斷標誌
    interval = setInterval(checkAndUpdateProgress, 1000); // 每秒更新進度
  }

  // 用於關閉模態視窗
  function closeEditingModal() {
    const modal = document.querySelector('div[style*="position: fixed"]');
    const overlay = document.querySelector(
      'div[style*="backgroundColor: rgba(0, 0, 0, 0.5)"]'
    );
    if (modal) {
      document.body.removeChild(modal);
    }
    if (overlay) {
      document.body.removeChild(overlay);
    }
  }
</script>
