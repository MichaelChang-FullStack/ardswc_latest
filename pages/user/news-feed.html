<script>

  var newsList = {};
  var announcementTypes = {
    1: "會員公告",
    2: "系統通知",
    3: "活動訊息",
    4: "新書消息",
    5: "資源上架",
    6: "線上展覽",
    7: "媒體報導",
    8: "系統公告",
    9: "計畫公告",
    10: "職缺公告",
    11: "戶外教室參訪",
    12: "檔期管理",
    13: "教具租借",
    14: "點數兌換",
    15: "試教影片",
    16: "360影片",
  };

  function getNewsContent(no) {
    updateNews(no);
    const newsItem = newsList.find(news => news.NE_NO === no);
    const { NE_NO, NE_CATEGORY_NO, NE_CATEGORY, NE_CREATEDATE, NE_SUBJECT, NE_CONTENT, NE_SOURCE_NO, NE_FILE_NAME } = newsItem;
    const date = getFormattedDate(NE_CREATEDATE.date);
    console.log(NE_CATEGORY_NO)
    console.log(announcementTypes[NE_CATEGORY_NO])
    console.log("上傳成功: ", NE_FILE_NAME); // 確認是否有成功回傳檔案名
    let fileNames = [];
    if (NE_FILE_NAME) {
      fileNames = Array.isArray(NE_FILE_NAME)
        ? NE_FILE_NAME  // 如果是陣列，直接使用
        : NE_FILE_NAME.split(', ');  // 如果是字串，使用逗號分割為陣列
    }
    console.log("上傳成功: ", fileNames); // 確認是否有成功回傳檔案名

    $("#news-container").empty();
    $(".main_container_part5_child2").hide();
    $("#readSign").hide();

    // 生成HTML內容
    $("#news-container").append(
      `
  <div class="news-content">
    <span class="category">[${announcementTypes[NE_CATEGORY_NO]}]</span>
    <span class="status">${NE_SUBJECT}</span>
    <span class="date">${date}</span>
  </div>
  <hr style="margin-top:15px; margin-bottom:30px;"/>
  <div class="newscontent">
    ${NE_CONTENT}
  </div>

  ${NE_FILE_NAME && fileNames.length ? `
  <div class="main_container_part4_child3_1_new_2" id="file-container">
    ${fileNames.map(fileName => `
      <div class="main_container_part4_child3_subchild2_2">
        <button class="download-btn" onclick="download('${fileName}')">${fileName}</button>
      </div>
    `).join('')}
  </div>
  ` : ''}

  <div style="display: flex; justify-content: center;">
    <button class="button02_n" onclick="toNewsList()">
      <span>返回消息列表</span>
    </button>
  </div>
  `
    );

  }

  async function download(fileName) {
    try {
      const response = await fetch(`/Files/News/${fileName}`);
      if (!response.ok) {
        throw new Error(`Network response was not ok: ${response.statusText}`);
      }

      const blob = await response.blob();
      const url = window.URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = fileName;

      document.body.appendChild(link);
      link.click();

      // 移除链接并释放 URL 对象
      document.body.removeChild(link);
      window.URL.revokeObjectURL(url);
    } catch (error) {
      console.error('Download failed:', error);
    }
  }

  function openNewPage(no, neSourceNo) {
    updateNews(no);
    const url = neSourceNo;
    window.open(url, '_blank');
  }

  async function toNewsList() {
    $("#news-container").empty();
    $(".main_container_part5_child2").show();
    $("#readSign").show();
    const latestNews = await getLatestNews();
    displayNews(latestNews);
    initializePagination();
  }

  async function getLatestNews() {
    const MNo = localStorage.getItem("MNo");
    var apiUrl = "/server/userNews.php";
    console.log(MNo)
    try {
      const response = await fetch(apiUrl, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          action: "read",
          MNo: MNo,
        }),
      });

      console.log("Response Status:", response.status);
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }

      const data = await response.json();

      if (data && data.length > 0) {
        newsList = data;
        return data;
      } else {
        console.error("No data returned from server");
        return null;
      }
    } catch (error) {
      console.error("Fetching user detail failed: ", error);
      throw error;
    }
  }

  async function updateNews(no) {
    const data = {
      action: "update",
      NO: no,
      MNo: localStorage.getItem("MNo")
    };

    try {
      const response = await fetch("/server/userNews.php", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify(data),
      });

      if (!response.ok) {
        throw new Error(`HTTP error! Status: ${response.status}`);
      }

      const result = await response.json();
      console.log("Server response:", result);

      // $("#news-container").empty();
      // const latestNews = await getLatestNews();
      // displayNews(latestNews);
      // initializePagination();

    } catch (error) {
      console.error("Error:", error);
    }
  }

  async function readAll() {
    const data = {
      action: "updateAll",
      MNo: localStorage.getItem("MNo")
    };

    try {
      const response = await fetch("/server/userNews.php", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify(data),
      });

      if (!response.ok) {
        throw new Error(`HTTP error! Status: ${response.status}`);
      }

      const result = await response.json();
      $("#news-container").empty();
      const latestNews = await getLatestNews();
      displayNews(latestNews);
      initializePagination();
      console.log("Server response:", result);
    } catch (error) {
      console.error("Error:", error);
    }
  }



  // Function to display news
  function displayNews(newsList) {
    newsList.forEach(news => {
      const { NE_NO, NE_CATEGORY_NO, NE_CATEGORY, NE_CREATEDATE, NE_SUBJECT, NE_CONTENT, HasRead, NE_SOURCE_NO } = news;

      // console.log({news})

      $("#news-container").append(
        `

          <hr class="gray_strip_below_title">
        </div>
        <div class="main_container">
          <div class="main_container_part4_child4_1_subchild2 ${HasRead == 1 ? 'read' : ''}" 
     onclick="${NE_SOURCE_NO ? `openNewPage('${NE_NO}','${NE_SOURCE_NO}')` : `getNewsContent('${NE_NO}')`}">
            <h4 class="latest_news_title start-title">
              <span class="date space">
                ${date}
              </span>
              <span class="category space">
                [${announcementTypes[NE_CATEGORY_NO]}]
              </span>
            </h4>
            <h4 class="latest_news_title latest-news-subject">
              <span class="content1">
                ${NE_SUBJECT}
              </span>
            </h4>
          </div>
        </div>
        <div class="main_container_part4_child3_2">
          <hr class="gray_strip_below_title">
        </div>
      </div>
      `
      );
    });
  }

  // Function to initialize pagination
  function initializePagination() {
    const itemsPerPage = 20;
    let totalItems = $('.main_container_part5_child1_sub2_block1').length;

    // Calculate total number of pages
    let totalPages = Math.ceil(totalItems / itemsPerPage);

    // Function to update pagination when totalItems change
    function updatePagination() {
      totalItems = $('.main_container_part5_child1_sub2_block1').length;
      totalPages = Math.ceil(totalItems / itemsPerPage);

      // Create page buttons
      const pageButtonsContainer = $('.pageButtons');
      pageButtonsContainer.empty();
      for (let i = 1; i <= totalPages; i++) {
        pageButtonsContainer.append(`<button class="pageButton" data-page="${i}">${i}</button>`);
      }

      // Show first page on load
      showPage(1);
    }

    // Call updatePagination function initially to set up pagination
    updatePagination();

    // Handle page navigation buttons
    $('.gotoFirstPage').click(function () {
      scrollToTop();
      showPage(1);
    });

    $('.gotoBeforePage').click(function () {
      const currentPage = $('.pageButton.active').data('page');
      if (currentPage > 1) {
        scrollToTop();
        showPage(currentPage - 1);
      }
    });

    $('.gotoNextPage').click(function () {
      const currentPage = $('.pageButton.active').data('page');
      if (currentPage < totalPages) {
        scrollToTop();
        showPage(currentPage + 1);
      }
    });

    $('.gotoLastPage').click(function () {
      scrollToTop();
      showPage(totalPages);
    });

    // Handle direct page navigation
    $('.pageButton').click(function () {
      const page = $(this).data('page');
      scrollToTop();
      showPage(page);
    });

    function showPage(page) {
      // Mark current page button as active
      $('.pageButton').removeClass('active');
      $(`.pageButton[data-page="${page}"]`).addClass('active');

      // Calculate start and end index of items to be shown
      const startIndex = (page - 1) * itemsPerPage;
      const endIndex = Math.min(startIndex + itemsPerPage - 1, totalItems - 1);

      // Hide all items and show only those on the current page
      $('.main_container_part5_child1_sub2_block1').hide();
      $(`.main_container_part5_child1_sub2_block1:nth-child(n + ${startIndex + 1}):nth-child(-n + ${endIndex + 1})`).show();

      // Enable/disable navigation buttons based on current page
      $('.gotoFirstPage, .gotoBeforePage').prop('disabled', page === 1);
      $('.gotoNextPage, .gotoLastPage').prop('disabled', page === totalPages);

      // Update "five page direct navigate button"
      updateFivePageButtons(page, totalPages);

      // Update the count display
      const countDisplay = $('.countDisplay');
      countDisplay.text(`第 ${page}/${totalPages}頁,共${totalItems}筆`);
    }

    function updateFivePageButtons(currentPage, totalPages) {
      const pageButtons = $('.pageButton');
      const maxVisibleButtons = 5;

      // Calculate the first and last page numbers for the five-page navigation
      let firstPage = Math.max(1, currentPage - Math.floor(maxVisibleButtons / 2));
      let lastPage = Math.min(totalPages, firstPage + maxVisibleButtons - 1);

      // Make sure there are exactly maxVisibleButtons buttons visible
      if (lastPage - firstPage + 1 < maxVisibleButtons) {
        lastPage = Math.min(totalPages, lastPage + (maxVisibleButtons - (lastPage - firstPage + 1)));
        firstPage = Math.max(1, lastPage - maxVisibleButtons + 1);
      }

      // Show/hide buttons based on the calculated range
      pageButtons.hide();
      $(`.pageButton:nth-child(n + ${firstPage}):nth-child(-n + ${lastPage})`).show();

      // Mark current page button as active
      pageButtons.removeClass('active');
      $(`.pageButton[data-page="${currentPage}"]`).addClass('active');
    }
  }

  // Call the function inside $(document).ready()
  $(document).ready(async function () {
    const latestNews = await getLatestNews();
    displayNews(latestNews);
    initializePagination();
    console.log({ latestNews });
  });


</script>
