<script>
    Alpine.data("PrizeDatas", () => ({
        prizes: [],
        init(){
            this.getPrizes();
        },
        getPrizes(){
            const apiUrl = '/server/routes.php?action=prizes';

            this.myFetch(apiUrl, {
                method: 'GET',
                headers: {
                'Content-Type': 'application/json',
                },
            }, data => {
                this.prizes = data;
                console.log(data);
            });
        },
        myFetch(apiUrl, options, resolve) {
            fetch(apiUrl, options)
            .then((res) => {
                const contentType = res.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    console.log("非 JSON 格式資料");
                    res = res.text();
                } else {
                    res = res.json();
                }
                return res;
            })
            .then(resolve)
            .catch((e) => console.log(e));
        },
    }));
</script>
<ul class="wrap" x-data="PrizeDatas">
    <template x-for="prize in prizes">
        <li>
            <div class="img" :style="{ backgroundImage: `url('/files/prizes/${prize.PrizeId}/Image/${prize.Image}')`}"></div>
            <h3 x-text="prize.Title"></h3>
            <div class="operation">
                <div class="cost" x-text="prize.Cost + '點'"></div>
                <button type="button">我要兌換</button>
            </div>
        </li>
    </template>
</ul>
