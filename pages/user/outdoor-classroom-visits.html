<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="../css/outdoor_classroom_visits.css" />
    <link rel="stylesheet" type="text/css" href="../css/bootstrap.css" />
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js?v=1.0.0"></script>
    <title>Document</title>
  </head>
  <body>

    <div class="tab">
      <span id="pendingReviewBtn" class="active-btn">待審核</span> |
      <span id="historyBtn">歷年紀錄</span>
    </div>

    <div id="pendingReviewTable" class="table-container active">
      <table
      
      class="reservation-table"
    >
      <thead>
        <tr>
          <th>審核狀態</th>
          <th>戶外教室</th>
          <th>參訪時間</th>
          <th>參訪團體</th>
          <th>參訪人數</th>
          <th>查看/編輯</th>
          <th>申請時間</th>
        </tr>
      </thead>
      <tbody class="pendingReviewData">
        
      </tbody>
    </table>
      <div class="main_container_part5_child2">
        <div class="countDisplay-pendingApply"></div>

        <div class="pagination pagination-pendingApply">
          <svg class="gotoFirstPage gotoFirstPage-pendingApply" xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50" fill="none">
              <rect x="50" y="50" width="50" height="50" rx="15" transform="rotate(-180 50 50)" fill="black" />
              <path d="M30 19L24 25L30 31" stroke="white" stroke-width="2" />
              <path d="M20 31L20 19" stroke="white" stroke-width="2" />
          </svg>
          <svg class="gotoBeforePage gotoBeforePage-pendingApply" xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50" fill="none">
              <rect x="50" y="50" width="50" height="50" rx="15" transform="rotate(-180 50 50)" fill="#F0F4F5" />
              <path d="M28 19L22 25L28 31" stroke="black" stroke-width="2" />
          </svg>
          <span class="pageButtons pageButtons-pendingApply"></span>
          <svg class="gotoNextPage gotoNextPage-pendingApply" xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50" fill="none">
              <rect width="50" height="50" rx="15" fill="#F0F4F5" />
              <path d="M22 31L28 25L22 19" stroke="black" stroke-width="2" />
          </svg>
          <svg class="gotoLastPage gotoLastPage-pendingApply" xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50" fill="none">
              <rect width="50" height="50" rx="15" fill="black" />
              <path d="M20 31L26 25L20 19" stroke="white" stroke-width="2" />
              <path d="M30 19L30 31" stroke="white" stroke-width="2" />
          </svg>

      </div>

        <div id="background-container">
            <div id="footer-bg-5" class="container-box--background-5"></div>
            <div id="footer-bg-6" class="container-box--background-6"></div>
        </div>
    </div>
</div>
    </div>

    <div id="historyTable" class="table-container">
    <table  class="reservation-table ">
      <thead>
        <tr>
          <th>審核狀態</th>
          <th>戶外教室</th>
          <th>參訪時間</th>
          <th>參訪團體</th>
          <th>參訪人數</th>
          <th>查看/編輯</th>
          <th>申請時間</th>
        </tr>
      </thead>
      <tbody class="historyData">
        
      </tbody>
    </table>

    <div class="main_container_part5_child2">
      <div class="countDisplay-historyApply"></div>

      <div class="pagination pagination-historyApply">
        <svg class="gotoFirstPage gotoFirstPage-historyApply" xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50" fill="none">
            <rect x="50" y="50" width="50" height="50" rx="15" transform="rotate(-180 50 50)" fill="black" />
            <path d="M30 19L24 25L30 31" stroke="white" stroke-width="2" />
            <path d="M20 31L20 19" stroke="white" stroke-width="2" />
        </svg>
        <svg class="gotoBeforePage gotoBeforePage-historyApply" xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50" fill="none">
            <rect x="50" y="50" width="50" height="50" rx="15" transform="rotate(-180 50 50)" fill="#F0F4F5" />
            <path d="M28 19L22 25L28 31" stroke="black" stroke-width="2" />
        </svg>
        <span class="pageButtons pageButtons-historyApply"></span>
        <svg class="gotoNextPage gotoNextPage-historyApply" xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50" fill="none">
            <rect width="50" height="50" rx="15" fill="#F0F4F5" />
            <path d="M22 31L28 25L22 19" stroke="black" stroke-width="2" />
        </svg>
        <svg class="gotoLastPage gotoLastPage-historyApply" xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50" fill="none">
            <rect width="50" height="50" rx="15" fill="black" />
            <path d="M20 31L26 25L20 19" stroke="white" stroke-width="2" />
            <path d="M30 19L30 31" stroke="white" stroke-width="2" />
        </svg>

    </div>

      <div id="background-container">
          <div id="footer-bg-5" class="container-box--background-5"></div>
          <div id="footer-bg-6" class="container-box--background-6"></div>
      </div>
  </div>
    </div>

    <div
    class="modal fade"
    id="Modal"
    tabindex="-1"
    aria-labelledby="exampleModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog  modal-dialog-centered"> 
      <div class="modal-content">
        <div class="modal-header">
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>

        </div>
        <div class="modal-body">

            <div class="header">
              
                <div class="header-content">
                    <div class="title d-flex justify-content-center align-items-center">
                        <div class="logo"></div>
                        <span class="title-text">戶外教室申請</span>
                    </div>
                    <div class="section location d-flex">
                        <div class="label">戶外教室</div>
                        <div class="item">
                            <div class="icon"></div>
                            <span class="name modal_location"></span>
                        </div>
                    </div>
                    <div class="section group d-flex">
                        <div class="label">團體名稱</div>
                        <div class="item">
                            <div class="icon"></div>
                            <span class="name modal_group"></span>
                        </div>
                    </div>
                    <div class="section contact d-flex">
                        <div class="label">聯絡人</div>
                        <div class="item">
                            <div class="icon"></div>
                            <span class="name modal_contact"></span>
                        </div>
                    </div>
                    <div class="section phone d-flex">
                        <div class="label">聯絡電話</div>
                        <div class="item">
                            <div class="icon"></div>
                            <span class="number modal_phone"></span>
                        </div>
                    </div>
                    <div class="section address d-flex">
                        <div class="label">聯絡地址</div>
                        <div class="item">
                            <div class="icon"></div>
                            <span class="text modal_address"></span>
                        </div>
                    </div>
                    <div class="section email d-flex">
                        <div class="label">電子信箱</div>
                        <div class="item">
                            <div class="icon"></div>
                            <span class="address modal_email"></span>
                        </div>
                    </div>
                    <div class="section date d-flex">
                        <div class="label">參觀日期</div>
                        <div class="item">
                            <div class="icon"></div>
                            <span class="visit-date modal_date"></span>
                        </div>
                    </div>
                    <div class="section people d-flex">
                        <div class="label">報名人數</div>
                        <div class="item">
                            <div class="icon"></div>
                            <span class="count modal_people"></span>
                        </div>
                    </div>
                    <div class="section remarks d-flex">
                        <div class="label">備註</div>
                        <div class="item">
                            <div class="icon"></div>
                            <span class="text modal_remarks"></span>
                        </div>
                    </div>
                    <hr>
                    <div class="section result d-flex">
                        <div class="label">申請結果</div>
                        <div class="">
                            <div class="icon modal_result"></div>
                        </div>
                    </div>
                    <div class="status d-flex">
                        <div class="icon"></div>
                    </div>
                    <div class="status-text">
                        <div class="text"></div>
                        <div class="item">
                            <div class="icon"></div>
                            <div class="content">
                                <div class="text"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- <span class="cancellation">您已取消申請。</span> -->

            </div>

        
        </div>
      </div>
    </div>
  </div>


  <div
      class="modal fade"
      id="cancel_Modal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
      data-id=""
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-body cancel_Modal_body">
            <img
              src="../asset/images/Fun_Outdoor_Teaching_Classroom_Map_Detail/Group 1000004811.svg"
              alt=""
            />
            <div class="modal-title">
              請確認是否取消申請？

            </div>
            <p>（申請一但取消，即不可回復）</p>
            <div class="button-container d-flex">
              <button class="button02_n" onclick="hideModal()">
                <span>保留申請</span>
              </button>
              <button class="return-button" onclick="cancelApply()">取消申請</button>

            </div>
          </div>
        </div>
      </div>
    </div>

  <script src="../js/outdoor_classroom_visits.js"></script>

  </body>

</html>
