    <h2>簡訊測試</h2>
    <form id="testForm">
      <label for="cellphone">手機:</label>
      <input type="text" id="cellphone" name="cellphone" required /><br /><br />

      <label for="Name">姓名:</label>
      <input type="text" id="Name" name="Name" required /><br /><br />

      <label for="content">內容:</label>
      <input type="text" id="content" name="content" required /><br /><br />

      <button type="button" onclick="sendSMS()">發送簡訊</button>
    </form>

    <!-- 引入 jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script>
      $(document).ready(function () {
        $("#emailForm").submit(function (event) {
          event.preventDefault();

          sendEmail(1, "disaster_setup");
        });
      });
    </script>

    <script>
      function sendSMS() {
        const formData = {
          cellphone: document.getElementById("cellphone").value,
          Name: document.getElementById("Name").value,
          content: document.getElementById("content").value,
        };

        fetch("/server/SMS.php", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(formData),
        })
          .then((response) => response.json())
          .then((data) => {
            alert(`Response: ${JSON.stringify(data)}`);
          })
          .catch((error) => {
            alert("Error: " + error);
            console.error("Error:", error);
          });
      }

      async function sendEmail(id, templateName) {
        const data = {
          templateName: templateName,
          id: id,
          email: [document.getElementById("email1").value],
          subject: document.getElementById("subject").value,
          message: document.getElementById("message").value,
        };

        try {
          const response = await fetch("/server/sendMail.php", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(data),
          });

          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }

          const result = await response.json();
          console.log("Server response:", result);

          $("#Get_Applications_Modal").modal("show");
        } catch (error) {
          console.log(error.message);
          console.error("Error:", error);
          alert("郵件發送失敗");
        }
      }
    </script>
