version: '3'

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2017-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: Swcb2022Learn
    ports:
      - "1433:1433"
    hostname: Learn_swcb
    volumes:
      - ./Learn_swcb_new_backup.bak:/var/opt/mssql/backup/Learn_swcb_new_backup.bak
      - ./class_backup.bak:/var/opt/mssql/backup/class_backup.bak
      - ./restore-database.sql:/var/opt/mssql/backup/restore-database.sql
      - ./entrypoint.sh:/entrypoint.sh
    entrypoint: /entrypoint.sh
  webserver:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - php

  php:
    image: php:7.4-fpm
    volumes:
      - ./:/var/www/html

